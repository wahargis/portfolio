<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
<title id="title">Model routing and provider isolation</title>
<desc id="desc">Flip owns the product contract; route policy and adapters select compatible hosted or local inference and normalize results.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1280" height="730"/>
<text x="45" y="45" class="title">Model routing and provider isolation</text>
<rect class="box" x="55" y="100" width="330" height="150"/>
<text x="75" y="131" class="head">Product runtime</text>
<text x="75" y="157" class="body">identity · context · admitted tools</text>
<text x="75" y="179" class="body">terminal composition · persistence</text>
<rect class="soft" x="475" y="100" width="330" height="150"/>
<text x="495" y="131" class="head">Route policy</text>
<text x="495" y="157" class="body">surface requirements</text>
<text x="495" y="179" class="body">privacy · latency · health</text>
<text x="495" y="201" class="body">local / hosted preference</text>
<rect class="box" x="895" y="100" width="330" height="150"/>
<text x="915" y="131" class="head">Provider adapter</text>
<text x="915" y="157" class="body">request/stream normalization</text>
<text x="915" y="179" class="body">tool and finish compatibility</text>
<path class="arrow" d="M385 175 L475 175"/>
<path class="arrow" d="M805 175 L895 175"/>
<rect class="box" x="160" y="420" width="330" height="130"/>
<text x="180" y="451" class="head">Hosted inference</text>
<text x="180" y="477" class="body">provider capability and capacity</text>
<text x="180" y="499" class="body">bounded credentials</text>
<rect class="box" x="790" y="420" width="330" height="130"/>
<text x="810" y="451" class="head">Local / HomeCloud inference</text>
<text x="810" y="477" class="body">health · slots · GPU placement</text>
<text x="810" y="499" class="body">provider-compatible endpoint</text>
<path class="arrow" d="M1060 250 L1060 350 L325 350 L325 420"/>
<path class="arrow" d="M1060 250 L955 420"/>
<rect class="box" x="475" y="610" width="330" height="85"/>
<text x="495" y="641" class="head">Normalized result + correlation</text>
<text x="495" y="667" class="body">content · tool calls · usage · error class</text>
<path class="arrow" d="M325 550 L325 575 L640 575 L640 610"/>
<path class="arrow" d="M955 550 L955 575 L640 575"/>
<path class="dash" d="M640 610 L640 570 L220 570 L220 250"/>
<text x="225" y="562" class="small">returns to product runtime</text>
</svg>
