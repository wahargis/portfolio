<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Product and synthetic deployment boundary</title>
<desc id="desc">Product, synthetic technical, CI, and development environments share architecture contracts but not data, credentials, queues, sessions, storage, or provider authority.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1320" height="760"/>
<text x="45" y="45" class="title">Product and synthetic deployment boundary</text>
<rect class="soft" x="330" y="80" width="660" height="100"/>
<text x="350" y="111" class="head">Shared architecture contract</text>
<text x="350" y="137" class="body">source version · migrations · domain semantics · public scenario definitions</text>
<rect class="box" x="55" y="285" width="280" height="170"/>
<text x="75" y="316" class="head">Product environment</text>
<text x="75" y="342" class="body">private user/community data</text>
<text x="75" y="364" class="body">independent secrets and sessions</text>
<text x="75" y="386" class="body">independent queues/storage/providers</text>
<rect class="box" x="365" y="285" width="280" height="170"/>
<text x="385" y="316" class="head">Synthetic technical environment</text>
<text x="385" y="342" class="body">versioned synthetic fixtures</text>
<text x="385" y="364" class="body">independent secrets and sessions</text>
<text x="385" y="386" class="body">independent queues/storage/providers</text>
<rect class="box" x="675" y="285" width="280" height="170"/>
<text x="695" y="316" class="head">CI / integration</text>
<text x="695" y="342" class="body">ephemeral database and fixtures</text>
<text x="695" y="364" class="body">fakes + selected integrations</text>
<text x="695" y="386" class="body">release evidence</text>
<rect class="box" x="985" y="285" width="280" height="170"/>
<text x="1005" y="316" class="head">Local development</text>
<text x="1005" y="342" class="body">developer-owned local data</text>
<text x="1005" y="364" class="body">isolated credentials</text>
<text x="1005" y="386" class="body">no implicit production copy</text>
<path class="arrow" d="M660 180 L660 235 L195 235 L195 285"/>
<path class="arrow" d="M660 180 L660 235 L505 235 L505 285"/>
<path class="arrow" d="M660 180 L660 235 L815 235 L815 285"/>
<path class="arrow" d="M660 180 L660 235 L1125 235 L1125 285"/>
<rect class="soft" x="260" y="575" width="800" height="110"/>
<text x="280" y="606" class="head">Non-sharing boundary</text>
<text x="280" y="632" class="body">no production database snapshots, user uploads, credentials, tokens, queues, or realtime namespaces in the synthetic environment</text>
<path class="dash" d="M195 455 L195 520 L660 520 L660 575"/>
<text x="665" y="512" class="small">authority remains separate</text>
<path class="dash" d="M505 455 L505 520 L660 520"/>
</svg>
