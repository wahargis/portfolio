<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Testing, evaluation, and release evidence</title><desc id="desc">Deterministic application invariants and variable model behavior are tested through separate but connected paths.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Testing, evaluation, and release evidence</text><text x="70" y="88" class="sub">Deterministic application invariants and variable model behavior are tested through separate but connected paths.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#15803d">DETERMINISTIC SYSTEM CHECKS</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#c2410c">MODEL AND OPERATIONAL EVIDENCE</text>
<rect x="70.0" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">Schema and static checks</text>
<text x="86.0" y="263" class="nc">Migrations, types, formats, links,</text>
<text x="86.0" y="284" class="nc">configuration and secret scanning</text>
<path class="arrow" d="M276.7 277.5 H296.7"/>
<rect x="300.7" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="316.7" y="236" class="nt">Product-domain tests</text>
<text x="316.7" y="263" class="nc">Identity, authorization, transactions,</text>
<text x="316.7" y="284" class="nc">effects, provenance and lifecycle</text>
<path class="arrow" d="M507.3 277.5 H527.3"/>
<rect x="531.3" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="547.3" y="236" class="nt">Agent and tool fixtures</text>
<text x="547.3" y="263" class="nc">Admission, context, tool protocol,</text>
<text x="547.3" y="284" class="nc">terminal validation and retry classes</text>
<path class="arrow" d="M738.0 277.5 H758.0"/>
<rect x="762.0" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="778.0" y="236" class="nt">Background recovery</text>
<text x="778.0" y="263" class="nc">Jobs, stale work, callbacks, artifacts,</text>
<text x="778.0" y="284" class="nc">continuation and partial failure</text>
<path class="arrow" d="M968.7 277.5 H988.7"/>
<rect x="992.7" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="1008.7" y="236" class="nt">Client convergence</text>
<text x="1008.7" y="263" class="nc">Optimistic state, sync, realtime order,</text>
<text x="1008.7" y="284" class="nc">offline recovery and revocation</text>
<path class="arrow" d="M1199.3 277.5 H1219.3"/>
<rect x="1223.3" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="1239.3" y="236" class="nt">Security and isolation</text>
<text x="1239.3" y="263" class="nc">Scope override, cross-community reads,</text>
<text x="1239.3" y="284" class="nc">replay, unsafe target and environment boundary</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Route evaluation</text>
<text x="86.0" y="578" class="nc">Conversation, research, curation,</text>
<text x="86.0" y="599" class="nc">documents, tools and multimodal work</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Failure injection</text>
<text x="432.0" y="578" class="nc">Provider, tool, worker, database,</text>
<text x="432.0" y="599" class="nc">storage, network and stale-state cases</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">Operational records</text>
<text x="778.0" y="578" class="nc">Latency, usage, queue, tool, artifact,</text>
<text x="778.0" y="599" class="nc">continuation and client delivery state</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">Release decision</text>
<text x="1124.0" y="578" class="nc">Affected deterministic checks, route</text>
<text x="1124.0" y="599" class="nc">evaluation and public contract updates</text>
<path class="drop" d="M392.0 592.5 V502.0 H1108.0 V592.5"/>
<path class="drop" d="M738.0 592.5 V502.0 H1108.0 V592.5"/>
<path class="arrow" d="M1084.0 592.5 H1104.0"/>
<path class="drop" d="M1326.7 350 V430 H231.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H577.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H923.0 V520"/>
<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">EVIDENCE DISCIPLINE</text><text x="75" y="828" class="rail">Generated answer quality never substitutes for authorization, persistence, effect, recovery, and client-state assertions.</text>
</svg>