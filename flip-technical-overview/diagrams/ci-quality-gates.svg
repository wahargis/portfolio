<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Flip quality and release evidence</title>
<desc id="desc">Deterministic domain, integration, client, and security gates precede model-route evaluation; operational and user quality signals feed back into evaluation.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1320" height="760"/>
<text x="45" y="45" class="title">Flip quality and release evidence</text>
<rect class="box" x="55" y="95" width="270" height="120"/>
<text x="75" y="126" class="head">Change</text>
<text x="75" y="152" class="body">code · schema · client</text>
<text x="75" y="174" class="body">route · capability · deployment</text>
<rect class="soft" x="390" y="80" width="370" height="150"/>
<text x="410" y="111" class="head">Deterministic gates</text>
<text x="410" y="137" class="body">format / compile</text>
<text x="410" y="159" class="body">domain + authorization tests</text>
<text x="410" y="181" class="body">database/jobs/migrations</text>
<text x="410" y="203" class="body">client sync/build · security</text>
<rect class="box" x="825" y="95" width="260" height="120"/>
<text x="845" y="126" class="head">Release build</text>
<text x="845" y="152" class="body">assets · container/release</text>
<text x="845" y="174" class="body">migration compatibility</text>
<path class="arrow" d="M325 155 L390 155"/>
<path class="arrow" d="M760 155 L825 155"/>
<rect class="box" x="55" y="360" width="300" height="130"/>
<text x="75" y="391" class="head">End-to-end scenarios</text>
<text x="75" y="417" class="body">HTTP · jobs · database</text>
<text x="75" y="439" class="body">sync/channels · UI</text>
<text x="75" y="461" class="body">failure and recovery</text>
<rect class="box" x="430" y="360" width="300" height="130"/>
<text x="450" y="391" class="head">AI route evaluation</text>
<text x="450" y="417" class="body">tool correctness · citations</text>
<text x="450" y="439" class="body">curation validity · honesty</text>
<text x="450" y="461" class="body">latency / capacity</text>
<rect class="soft" x="805" y="360" width="300" height="130"/>
<text x="825" y="391" class="head">Release decision</text>
<text x="825" y="417" class="body">ship · constrain route</text>
<text x="825" y="439" class="body">block · require review</text>
<path class="arrow" d="M955 215 L955 305 L205 305 L205 360"/>
<path class="arrow" d="M355 425 L430 425"/>
<path class="arrow" d="M730 425 L805 425"/>
<rect class="box" x="360" y="610" width="600" height="100"/>
<text x="380" y="641" class="head">Operational and participant quality signals</text>
<text x="380" y="667" class="body">errors · retries · citation failures · corrections · recuration · sync drift</text>
<path class="arrow" d="M955 490 L955 550 L660 550 L660 610"/>
<path class="dash" d="M660 610 L660 565 L580 565 L580 490"/>
<text x="585" y="557" class="small">feed evaluation</text>
</svg>
