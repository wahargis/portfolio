<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">Web and native state synchronization</title>
<desc id="desc">Authoritative HTTP commands, Electric durable synchronization, and Phoenix ephemeral channels serve different state classes.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1280" height="740"/>
<text x="45" y="45" class="title">Web and native state synchronization</text>
<rect class="soft" x="55" y="100" width="340" height="180"/>
<text x="75" y="131" class="head">Client</text>
<text x="75" y="157" class="body">UI + local draft</text>
<text x="75" y="179" class="body">optimistic mutation</text>
<text x="75" y="201" class="body">authorized durable cache</text>
<text x="75" y="223" class="body">presence / typing</text>
<rect class="box" x="475" y="100" width="330" height="180"/>
<text x="495" y="131" class="head">Phoenix authority</text>
<text x="495" y="157" class="body">HTTP/domain commands</text>
<text x="495" y="179" class="body">authorization + validation</text>
<text x="495" y="201" class="body">canonical identities</text>
<text x="495" y="223" class="body">channels / PubSub</text>
<rect class="box" x="885" y="100" width="330" height="180"/>
<text x="905" y="131" class="head">PostgreSQL</text>
<text x="905" y="157" class="body">durable messages/threads</text>
<text x="905" y="179" class="body">permissions · artifacts</text>
<text x="905" y="201" class="body">transaction identity</text>
<path class="arrow" d="M395 170 L475 170"/>
<text x="435.0" y="162.0" text-anchor="middle" class="small">command</text>
<path class="arrow" d="M805 170 L885 170"/>
<text x="845.0" y="162.0" text-anchor="middle" class="small">transaction</text>
<rect class="soft" x="190" y="410" width="360" height="130"/>
<text x="210" y="441" class="head">Electric durable sync</text>
<text x="210" y="467" class="body">authorized shapes</text>
<text x="210" y="489" class="body">reconnect and canonical convergence</text>
<rect class="soft" x="730" y="410" width="360" height="130"/>
<text x="750" y="441" class="head">Ephemeral realtime</text>
<text x="750" y="467" class="body">presence · typing</text>
<text x="750" y="489" class="body">transient progress / alerts</text>
<path class="arrow" d="M1050 280 L1050 345 L370 345 L370 410"/>
<text x="375" y="337" class="small">committed rows</text>
<path class="arrow" d="M370 540 L370 620 L225 620 L225 280"/>
<text x="230" y="612" class="small">reconcile optimistic state</text>
<path class="arrow" d="M640 280 L640 350 L910 350 L910 410"/>
<text x="915" y="342" class="small">channel events</text>
<path class="dash" d="M910 540 L910 620 L345 620 L345 280"/>
<text x="350" y="612" class="small">non-durable projection</text>
</svg>
