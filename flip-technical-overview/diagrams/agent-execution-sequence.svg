<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Flip direct agent-turn sequence</title><desc id="desc">One product event becomes a scoped model execution and one validated, durable product outcome.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Flip direct agent-turn sequence</text><text x="70" y="88" class="sub">One product event becomes a scoped model execution and one validated, durable product outcome.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#0369a1">TURN ADMISSION AND EXECUTION</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#6d28d9">DURABLE OUTCOME AND RECOVERY</text>
<rect x="70.0" y="205" width="206.7" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">1. Product trigger</text>
<text x="86.0" y="263" class="nc">Mention, reply, product command,</text>
<text x="86.0" y="284" class="nc">or artifact continuation</text>
<path class="arrow" d="M276.7 277.5 H296.7"/>
<rect x="300.7" y="205" width="206.7" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="316.7" y="236" class="nt">2. Resolve scope</text>
<text x="316.7" y="263" class="nc">Actor, AI identity, community,</text>
<text x="316.7" y="284" class="nc">origin, visibility, feature state</text>
<path class="arrow" d="M507.3 277.5 H527.3"/>
<rect x="531.3" y="205" width="206.7" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="547.3" y="236" class="nt">3. Build context</text>
<text x="547.3" y="263" class="nc">Conversation, authorized retrieval,</text>
<text x="547.3" y="284" class="nc">sources, documents and artifacts</text>
<path class="arrow" d="M738.0 277.5 H758.0"/>
<rect x="762.0" y="205" width="206.7" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="778.0" y="236" class="nt">4. Admit route and tools</text>
<text x="778.0" y="263" class="nc">Model capability, trusted scope,</text>
<text x="778.0" y="284" class="nc">deadlines and effect policy</text>
<path class="arrow" d="M968.7 277.5 H988.7"/>
<rect x="992.7" y="205" width="206.7" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="1008.7" y="236" class="nt">5. Run model and tools</text>
<text x="1008.7" y="263" class="nc">Working rounds, typed calls,</text>
<text x="1008.7" y="284" class="nc">validated results and limits</text>
<path class="arrow" d="M1199.3 277.5 H1219.3"/>
<rect x="1223.3" y="205" width="206.7" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="1239.3" y="236" class="nt">6. Commit terminal result</text>
<text x="1239.3" y="263" class="nc">Validate reply and references,</text>
<text x="1239.3" y="284" class="nc">store activity and publish object</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Activity and evidence</text>
<text x="86.0" y="578" class="nc">Route, rounds, tool state, sources,</text>
<text x="86.0" y="599" class="nc">citations, artifacts and failure class</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Product object</text>
<text x="432.0" y="578" class="nc">Message, forum update, action, file,</text>
<text x="432.0" y="599" class="nc">chart, poll or generated artifact</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">Client convergence</text>
<text x="778.0" y="578" class="nc">API response, durable sync, realtime</text>
<text x="778.0" y="599" class="nc">event and optimistic reconciliation</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">Continuation</text>
<text x="1124.0" y="578" class="nc">Pending artifact completes later and</text>
<text x="1124.0" y="599" class="nc">starts one deduplicated scoped turn</text>
<path class="drop" d="M1326.7 350 V430 H231.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H577.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H923.0 V520"/>
<path class="drop" d="M1096.0 350 V430 H1269.0 V520"/>
<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">BOUNDS</text><text x="75" y="828" class="rail">Current authorization, turn and context budgets, tool deadlines, effect identities, terminal validation, and explicit failure state.</text>
</svg>