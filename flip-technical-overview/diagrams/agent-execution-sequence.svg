<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="790" viewBox="0 0 1300 790" role="img" aria-labelledby="title desc">
<title id="title">Governed AI reply lifecycle</title>
<desc id="desc">A product event becomes one durable job, bounded model/tool loop, validated terminal draft, and attributed product effect.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1300" height="790"/>
<text x="45" y="45" class="title">Governed AI reply lifecycle</text>
<rect class="box" x="55" y="125" width="335" height="145"/>
<text x="75" y="156" class="head">1 · Product event</text>
<text x="75" y="182" class="body">mention, reply, schedule</text>
<text x="75" y="204" class="body">or artifact terminal event</text>
<rect class="soft" x="465" y="125" width="335" height="145"/>
<text x="485" y="156" class="head">2 · Admission</text>
<text x="485" y="182" class="body">eligibility · uniqueness</text>
<text x="485" y="204" class="body">actor/community scope</text>
<rect class="box" x="875" y="125" width="335" height="145"/>
<text x="895" y="156" class="head">3 · Context + catalog</text>
<text x="895" y="182" class="body">selected product context</text>
<text x="895" y="204" class="body">server-admitted tools</text>
<rect class="box" x="55" y="430" width="335" height="145"/>
<text x="75" y="461" class="head">6 · Product commit</text>
<text x="75" y="487" class="body">validate output/evidence</text>
<text x="75" y="509" class="body">persist · publish · cleanup</text>
<rect class="soft" x="465" y="430" width="335" height="145"/>
<text x="485" y="461" class="head">5 · Terminal composition</text>
<text x="485" y="487" class="body">finish reserve · bounded repair</text>
<text x="485" y="509" class="body">user-facing draft</text>
<rect class="box" x="875" y="430" width="335" height="145"/>
<text x="895" y="461" class="head">4 · Working rounds</text>
<text x="895" y="487" class="body">provider call · tool dispatch</text>
<text x="895" y="509" class="body">citations/artifacts/failures</text>
<path class="arrow" d="M390 197 L465 197"/>
<path class="arrow" d="M800 197 L875 197"/>
<path class="arrow" d="M1042 270 L1042 430"/>
<path class="arrow" d="M875 502 L800 502"/>
<path class="arrow" d="M465 502 L390 502"/>
<rect class="box" x="55" y="665" width="335" height="75"/>
<text x="75" y="696" class="head">Durable terminal state</text>
<text x="75" y="722" class="body">completed reply/artifact or explicit failure</text>
<path class="arrow" d="M222 575 L222 665"/>
<path class="dash" d="M1042 575 L1042 630 L875 630 L875 575"/>
<text x="880" y="622" class="small">bounded tool/result loop</text>
</svg>
