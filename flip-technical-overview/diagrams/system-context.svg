<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Flip system context</title>
<desc id="desc">Members and administrators use web, desktop, and mobile clients. Flip owns product state, curation, AI participation, citations and artifacts, while model and external capability providers remain outside its authority.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1200" height="650"/>
<text x="45" y="45" class="title">Flip system context</text>
<rect class="box" x="55" y="115" width="250" height="120"/>
<text x="75" y="146" class="head">People</text>
<text x="75" y="172" class="body">members · moderators</text>
<text x="75" y="194" class="body">community administrators</text>
<rect class="box" x="365" y="115" width="275" height="120"/>
<text x="385" y="146" class="head">Clients</text>
<text x="385" y="172" class="body">Phoenix web</text>
<text x="385" y="194" class="body">React desktop / mobile</text>
<rect class="soft" x="710" y="85" width="435" height="250"/>
<text x="730" y="116" class="head">Flip product authority</text>
<text x="730" y="142" class="body">accounts and authorization</text>
<text x="730" y="164" class="body">chat and forum</text>
<text x="730" y="186" class="body">conversation curation</text>
<text x="730" y="208" class="body">AI participants</text>
<text x="730" y="230" class="body">citations and artifacts</text>
<rect class="box" x="55" y="430" width="300" height="120"/>
<text x="75" y="461" class="head">Model endpoints</text>
<text x="75" y="487" class="body">hosted routes</text>
<text x="75" y="509" class="body">local / HomeCloud</text>
<rect class="box" x="450" y="430" width="330" height="120"/>
<text x="470" y="461" class="head">External capabilities</text>
<text x="470" y="487" class="body">web · documents · data</text>
<text x="470" y="509" class="body">image · video · media</text>
<rect class="box" x="875" y="430" width="270" height="120"/>
<text x="895" y="461" class="head">Durable product state</text>
<text x="895" y="487" class="body">PostgreSQL · Oban</text>
<text x="895" y="509" class="body">Electric · PubSub</text>
<path class="arrow" d="M305 175 L365 175"/>
<path class="arrow" d="M640 175 L710 175"/>
<path class="arrow" d="M925 335 L925 385 L205 385 L205 430"/>
<text x="210" y="377" class="small">provider-compatible inference</text>
<path class="arrow" d="M960 335 L960 400 L615 400 L615 430"/>
<text x="620" y="392" class="small">governed tools</text>
<path class="arrow" d="M1010 335 L1010 430"/>
<text x="1010.0" y="374.5" text-anchor="middle" class="small">transactions / jobs</text>
<path class="dash" d="M875 490 L820 490 L820 270 L640 270"/>
<text x="825" y="262" class="small">durable sync + ephemeral events</text>
</svg>
