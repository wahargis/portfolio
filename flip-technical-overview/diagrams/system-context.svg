<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Flip system context</title><desc id="desc">Product users and clients interact with one application boundary; external AI and media services never own product identity or state.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Flip system context</text><text x="70" y="88" class="sub">Product users and clients interact with one application boundary; external AI and media services never own product identity or state.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#0369a1">PRODUCT ACTORS AND SURFACES</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#6d28d9">FLIP APPLICATION BOUNDARY</text>
<rect x="70.0" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">Members</text>
<text x="86.0" y="263" class="nc">Messages, replies, research,</text>
<text x="86.0" y="284" class="nc">documents, media, curation</text>
<rect x="346.8" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="362.8" y="236" class="nt">Moderators and operators</text>
<text x="362.8" y="263" class="nc">Configuration, review, repair,</text>
<text x="362.8" y="284" class="nc">failure and activity inspection</text>
<rect x="623.6" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="639.6" y="236" class="nt">Web application</text>
<text x="639.6" y="263" class="nc">LiveView and server-rendered</text>
<text x="639.6" y="284" class="nc">product interaction</text>
<rect x="900.4" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="916.4" y="236" class="nt">Desktop and mobile clients</text>
<text x="916.4" y="263" class="nc">Authenticated commands, sync,</text>
<text x="916.4" y="284" class="nc">realtime and local state</text>
<rect x="1177.2" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="1193.2" y="236" class="nt">Internal workflows</text>
<text x="1193.2" y="263" class="nc">Jobs, scheduled work, callbacks,</text>
<text x="1193.2" y="284" class="nc">and artifact continuation</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Product domains</text>
<text x="86.0" y="578" class="nc">Identity, communities, chat, forums,</text>
<text x="86.0" y="599" class="nc">search, media, notifications</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Agent and curation runtime</text>
<text x="432.0" y="578" class="nc">Admission, context, tools, activity,</text>
<text x="432.0" y="599" class="nc">artifacts, publication, recovery</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">Durable and realtime state</text>
<text x="778.0" y="578" class="nc">PostgreSQL, Oban, PubSub, Channels,</text>
<text x="778.0" y="599" class="nc">API and synchronization projections</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">External services</text>
<text x="1124.0" y="578" class="nc">Local and hosted models, web sources,</text>
<text x="1124.0" y="599" class="nc">documents, image/video, storage, push</text>
<path class="drop" d="M392.0 592.5 V502.0 H762.0 V592.5"/>
<path class="arrow" d="M738.0 592.5 H758.0"/>
<path class="drop" d="M738.0 592.5 V502.0 H1108.0 V592.5"/>
<path class="drop" d="M196.4 350 V430 H231.0 V520"/>
<path class="drop" d="M473.2 350 V430 H231.0 V520"/>
<path class="drop" d="M750.0 350 V430 H231.0 V520"/>
<path class="drop" d="M1026.8 350 V430 H923.0 V520"/>
<path class="drop" d="M1303.6 350 V430 H577.0 V520"/>
<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">AUTHORITY</text><text x="75" y="828" class="rail">Flip owns identity, authorization, product effects, persistence, and publication. External services receive bounded requests and return results.</text>
</svg>