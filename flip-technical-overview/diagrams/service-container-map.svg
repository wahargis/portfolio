<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">TRANSACTION AND RECOVERY</text><text x="75" y="828" class="rail">Product effects commit through owning contexts; queued work refers to durable records; clients recover from canonical state.</text>
</svg>