<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Flip service and container map</title>
<desc id="desc">The client layer talks to a modular Phoenix application. Product contexts share PostgreSQL, Oban, Electric, and PubSub; external models and tools remain behind product-owned adapters.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1280" height="760"/>
<text x="45" y="45" class="title">Flip service and container map</text>
<rect class="soft" x="55" y="95" width="1170" height="105"/>
<text x="75" y="126" class="head">Client layer</text>
<text x="75" y="152" class="body">Phoenix web · React/TypeScript client · Tauri desktop · Capacitor mobile</text>
<rect class="soft" x="55" y="260" width="1170" height="220"/>
<text x="75" y="291" class="head">Phoenix modular application</text>
<text x="75" y="317" class="body">accounts + authorization · chat · forum · synthesis + AI runtime</text>
<text x="75" y="339" class="body">notifications · media/artifacts · settings/support · audit</text>
<text x="75" y="361" class="body">HTTP/domain commands · synchronization controllers · channels</text>
<rect class="box" x="55" y="565" width="270" height="110"/>
<text x="75" y="596" class="head">PostgreSQL</text>
<text x="75" y="622" class="body">canonical durable state</text>
<text x="75" y="644" class="body">search · provenance</text>
<rect class="box" x="365" y="565" width="250" height="110"/>
<text x="385" y="596" class="head">Oban</text>
<text x="385" y="622" class="body">queues · schedules</text>
<text x="385" y="644" class="body">retry · uniqueness</text>
<rect class="box" x="655" y="565" width="250" height="110"/>
<text x="675" y="596" class="head">Realtime</text>
<text x="675" y="622" class="body">Electric durable sync</text>
<text x="675" y="644" class="body">PubSub / channels</text>
<rect class="box" x="945" y="565" width="280" height="110"/>
<text x="965" y="596" class="head">External capability</text>
<text x="965" y="622" class="body">model endpoints</text>
<text x="965" y="644" class="body">search/data/docs/media</text>
<path class="arrow" d="M640 200 L640 260"/>
<path class="arrow" d="M300 480 L300 525 L190 525 L190 565"/>
<path class="arrow" d="M520 480 L520 565"/>
<path class="arrow" d="M760 480 L760 565"/>
<path class="arrow" d="M1010 480 L1010 565"/>
</svg>
