<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Flip application and service containers</title><desc id="desc">Entry points call shared product contexts; background work and provider adapters operate against durable application state.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Flip application and service containers</text><text x="70" y="88" class="sub">Entry points call shared product contexts; background work and provider adapters operate against durable application state.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#0369a1">ENTRY POINTS</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#15803d">APPLICATION SERVICES</text>
<rect x="70.0" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">Phoenix web and LiveView</text>
<text x="86.0" y="263" class="nc">Server-rendered interaction</text>
<text x="86.0" y="284" class="nc">and direct context calls</text>
<rect x="346.8" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="362.8" y="236" class="nt">API and native commands</text>
<text x="362.8" y="263" class="nc">Authenticated product commands</text>
<text x="362.8" y="284" class="nc">and durable client projection</text>
<rect x="623.6" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="639.6" y="236" class="nt">Channels and PubSub</text>
<text x="639.6" y="263" class="nc">Ephemeral presence, progress,</text>
<text x="639.6" y="284" class="nc">typing and product events</text>
<rect x="900.4" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="916.4" y="236" class="nt">Oban and supervised workers</text>
<text x="916.4" y="263" class="nc">Curation, artifacts, repair,</text>
<text x="916.4" y="284" class="nc">notifications and continuation</text>
<rect x="1177.2" y="205" width="252.8" height="145" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
<text x="1193.2" y="236" class="nt">Callbacks and scheduled work</text>
<text x="1193.2" y="263" class="nc">Provider terminal events,</text>
<text x="1193.2" y="284" class="nc">maintenance and timed workflows</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Product contexts</text>
<text x="86.0" y="578" class="nc">Accounts, membership, chat, forums,</text>
<text x="86.0" y="599" class="nc">search, media and domain validation</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Agent services</text>
<text x="432.0" y="578" class="nc">Context, retrieval, routing, tools,</text>
<text x="432.0" y="599" class="nc">activity, evidence and terminal reply</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">PostgreSQL authority</text>
<text x="778.0" y="578" class="nc">Objects, relationships, lifecycle,</text>
<text x="778.0" y="599" class="nc">jobs, artifacts and sync state</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">External adapters</text>
<text x="1124.0" y="578" class="nc">Models, search, documents, storage,</text>
<text x="1124.0" y="599" class="nc">media, connectors and delivery</text>
