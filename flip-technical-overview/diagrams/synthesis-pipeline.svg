<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Conversation curation and forum publication</title><desc id="desc">Selected human conversation is organized into durable forum state while source authorship, access, and correction remain explicit.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Conversation curation and forum publication</text><text x="70" y="88" class="sub">Selected human conversation is organized into durable forum state while source authorship, access, and correction remain explicit.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#15803d">CURATION RUN</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#c2410c">PROVENANCE AND FAILURE STATE</text>
<rect x="70.0" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">1. Select sources</text>
<text x="86.0" y="263" class="nc">Room, actor and explicit message</text>
<text x="86.0" y="284" class="nc">selection with a stored version</text>
<path class="arrow" d="M276.7 277.5 H296.7"/>
<rect x="300.7" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="316.7" y="236" class="nt">2. Create run</text>
<text x="316.7" y="263" class="nc">Durable identity, stage, worker,</text>
<text x="316.7" y="284" class="nc">target scope and deduplication</text>
<path class="arrow" d="M507.3 277.5 H527.3"/>
<rect x="531.3" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="547.3" y="236" class="nt">3. Propose structure</text>
<text x="547.3" y="263" class="nc">Topics, titles, ordering, destinations</text>
<text x="547.3" y="284" class="nc">and limited generated bridge text</text>
<path class="arrow" d="M738.0 277.5 H758.0"/>
<rect x="762.0" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="778.0" y="236" class="nt">4. Validate plan</text>
<text x="778.0" y="263" class="nc">Destination, access, source coverage,</text>
<text x="778.0" y="284" class="nc">duplicates and current product state</text>
<path class="arrow" d="M968.7 277.5 H988.7"/>
<rect x="992.7" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="1008.7" y="236" class="nt">5. Publish transaction</text>
<text x="1008.7" y="263" class="nc">Forum objects plus participant and</text>
<text x="1008.7" y="284" class="nc">source-message relationships</text>
<path class="arrow" d="M1199.3 277.5 H1219.3"/>
<rect x="1223.3" y="205" width="206.7" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="1239.3" y="236" class="nt">6. Complete later stages</text>
<text x="1239.3" y="263" class="nc">Linkback, notification, feedback,</text>
<text x="1239.3" y="284" class="nc">repair and bounded recuration</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Source authorship</text>
<text x="86.0" y="578" class="nc">Human messages retain participant and</text>
<text x="86.0" y="599" class="nc">message identity; AI additions are marked</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Origin-aware access</text>
<text x="432.0" y="578" class="nc">Destination visibility cannot broaden</text>
<text x="432.0" y="599" class="nc">a more restrictive source boundary</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">Partial result</text>
<text x="778.0" y="578" class="nc">Completed publication remains durable</text>
<text x="778.0" y="599" class="nc">when linkback or notification later fails</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">Correction history</text>
<text x="1124.0" y="578" class="nc">Feedback and recuration retain the</text>
<text x="1124.0" y="599" class="nc">prior selection, run and publication</text>
<path class="drop" d="M1096.0 350 V430 H231.0 V520"/>
<path class="drop" d="M1096.0 350 V430 H577.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H923.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H1269.0 V520"/>
<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">RECOVERY</text><text x="75" y="828" class="rail">Stage state allows retry or repair at the failed step without recreating successful forum effects.</text>
</svg>