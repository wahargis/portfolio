<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">Conversation-to-forum curation</title>
<desc id="desc">The curation path preserves source authorship while using model assistance for topic structure, destination, and bounded bridge context.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1280" height="780"/>
<text x="45" y="45" class="title">Conversation-to-forum curation</text>
<rect class="box" x="55" y="95" width="300" height="125"/>
<text x="75" y="126" class="head">Eligible chat source</text>
<text x="75" y="152" class="body">messages · participants</text>
<text x="75" y="174" class="body">reply relationships · room policy</text>
<rect class="soft" x="455" y="95" width="330" height="125"/>
<text x="475" y="126" class="head">Topic and destination plan</text>
<text x="475" y="152" class="body">model-assisted grouping</text>
<text x="475" y="174" class="body">create · append · merge · defer</text>
<rect class="box" x="885" y="95" width="330" height="125"/>
<text x="905" y="126" class="head">Plan validation</text>
<text x="905" y="152" class="body">eligible source identities</text>
<text x="905" y="174" class="body">authorship · destination · duplicate state</text>
<path class="arrow" d="M355 157 L455 157"/>
<path class="arrow" d="M785 157 L885 157"/>
<rect class="soft" x="55" y="350" width="300" height="130"/>
<text x="75" y="381" class="head">Transactional apply</text>
<text x="75" y="407" class="body">forum thread / replies</text>
<text x="75" y="429" class="body">source relationships</text>
<rect class="box" x="455" y="350" width="330" height="130"/>
<text x="475" y="381" class="head">Structural context</text>
<text x="475" y="407" class="body">bounded bridge text</text>
<text x="475" y="429" class="body">distinct from participant words</text>
<rect class="box" x="885" y="350" width="330" height="130"/>
<text x="905" y="381" class="head">Linkback</text>
<text x="905" y="407" class="body">source room learns durable artifact</text>
<text x="905" y="429" class="body">independent retry state</text>
<path class="arrow" d="M1050 220 L1050 300 L205 300 L205 350"/>
<path class="arrow" d="M355 415 L455 415"/>
<path class="arrow" d="M785 415 L885 415"/>
<rect class="box" x="260" y="610" width="330" height="110"/>
<text x="280" y="641" class="head">Participant feedback</text>
<text x="280" y="667" class="body">correction · recuration request</text>
<text x="280" y="689" class="body">manual review when bounded attempts end</text>
<rect class="soft" x="690" y="610" width="330" height="110"/>
<text x="710" y="641" class="head">Durable forum knowledge</text>
<text x="710" y="667" class="body">inspectable source messages</text>
<text x="710" y="689" class="body">human / AI / structural authorship visible</text>
<path class="arrow" d="M1050 480 L1050 555 L425 555 L425 610"/>
<path class="arrow" d="M590 665 L690 665"/>
<path class="dash" d="M425 610 L425 540 L620 540 L620 220"/>
<text x="625" y="532" class="small">bounded recuration</text>
</svg>
