<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Governed tool and effect execution</title><desc id="desc">Model-generated requests pass through a turn-specific capability catalog and product services before any protected read or effect.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Governed tool and effect execution</text><text x="70" y="88" class="sub">Model-generated requests pass through a turn-specific capability catalog and product services before any protected read or effect.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#0e7490">TOOL REQUEST PATH</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#c2410c">RESULT CLASSES</text>
<rect x="70.0" y="205" width="206.7" height="145" rx="13" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">Model request</text>
<text x="86.0" y="263" class="nc">Tool name and user-controlled</text>
<text x="86.0" y="284" class="nc">arguments from the current round</text>
<path class="arrow" d="M276.7 277.5 H296.7"/>
<rect x="300.7" y="205" width="206.7" height="145" rx="13" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5"/>
<text x="316.7" y="236" class="nt">Capability lookup</text>
<text x="316.7" y="263" class="nc">Tool admitted for this actor,</text>
<text x="316.7" y="284" class="nc">surface, route and feature state</text>
<path class="arrow" d="M507.3 277.5 H527.3"/>
<rect x="531.3" y="205" width="206.7" height="145" rx="13" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5"/>
<text x="547.3" y="236" class="nt">Schema validation</text>
<text x="547.3" y="263" class="nc">Typed arguments, size and format,</text>
<text x="547.3" y="284" class="nc">unsupported fields rejected</text>
<path class="arrow" d="M738.0 277.5 H758.0"/>
<rect x="762.0" y="205" width="206.7" height="145" rx="13" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5"/>
<text x="778.0" y="236" class="nt">Trusted scope injection</text>
<text x="778.0" y="263" class="nc">Actor, community, origin, AI identity,</text>
<text x="778.0" y="284" class="nc">workspace and operation identity</text>
<path class="arrow" d="M968.7 277.5 H988.7"/>
<rect x="992.7" y="205" width="206.7" height="145" rx="13" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5"/>
<text x="1008.7" y="236" class="nt">Authorization and execution</text>
<text x="1008.7" y="263" class="nc">Owning product or external service,</text>
<text x="1008.7" y="284" class="nc">timeout, concurrency and retry class</text>
<path class="arrow" d="M1199.3 277.5 H1219.3"/>
<rect x="1223.3" y="205" width="206.7" height="145" rx="13" fill="#cffafe" stroke="#22d3ee" stroke-width="1.5"/>
<text x="1239.3" y="236" class="nt">Normalized result</text>
<text x="1239.3" y="263" class="nc">Durable result or effect identity,</text>
<text x="1239.3" y="284" class="nc">status, evidence and failure returned</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Read-only result</text>
<text x="86.0" y="578" class="nc">Scoped product record, source,</text>
<text x="86.0" y="599" class="nc">document passage or analysis data</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Committed product effect</text>
<text x="432.0" y="578" class="nc">Validated mutation with canonical</text>
<text x="432.0" y="599" class="nc">identity, lifecycle and client event</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">Pending asynchronous artifact</text>
<text x="778.0" y="578" class="nc">Provider attempt, progress, terminal</text>
<text x="778.0" y="599" class="nc">state, cancellation and continuation</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">Refusal or failure</text>
<text x="1124.0" y="578" class="nc">Unknown tool, invalid schema, denied</text>
<text x="1124.0" y="599" class="nc">scope, timeout or unsafe retry</text>
<path class="drop" d="M1326.7 350 V430 H231.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H577.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H923.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H1269.0 V520"/>
<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">RETRY RULE</text><text x="75" y="828" class="rail">Read, effect, and asynchronous capabilities use different retry and idempotency behavior; provider retry cannot repeat a committed effect.</text>
</svg>