<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760" role="img" aria-labelledby="title desc">
<title id="title">Server-authoritative tool execution</title>
<desc id="desc">The server computes the capability catalog, supplies trusted scope, isolates dispatch, and commits effects through domain services.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1250" height="760"/>
<text x="45" y="45" class="title">Server-authoritative tool execution</text>
<rect class="box" x="55" y="100" width="300" height="130"/>
<text x="75" y="131" class="head">Context</text>
<text x="75" y="157" class="body">actor · community · surface</text>
<text x="75" y="179" class="body">features · provider availability</text>
<rect class="soft" x="455" y="100" width="340" height="130"/>
<text x="475" y="131" class="head">Capability catalog</text>
<text x="475" y="157" class="body">server-defined schemas</text>
<text x="475" y="179" class="body">surface-specific filter/replacement</text>
<rect class="box" x="895" y="100" width="300" height="130"/>
<text x="915" y="131" class="head">Model choice</text>
<text x="915" y="157" class="body">select among admitted tools</text>
<text x="915" y="179" class="body">structured call only</text>
<path class="arrow" d="M355 165 L455 165"/>
<path class="arrow" d="M795 165 L895 165"/>
<rect class="soft" x="455" y="310" width="340" height="130"/>
<text x="475" y="341" class="head">Validation + trusted scope</text>
<text x="475" y="367" class="body">known name · valid arguments</text>
<text x="475" y="389" class="body">authorization · URL/object policy</text>
<path class="arrow" d="M1045 230 L1045 275 L625 275 L625 310"/>
<rect class="box" x="55" y="520" width="300" height="130"/>
<text x="75" y="551" class="head">Read / analysis</text>
<text x="75" y="577" class="body">normalized data + source identity</text>
<text x="75" y="599" class="body">no product mutation</text>
<rect class="box" x="475" y="520" width="300" height="130"/>
<text x="495" y="551" class="head">Durable effect</text>
<text x="495" y="577" class="body">domain command + receipt</text>
<text x="495" y="599" class="body">artifact/action identity</text>
<rect class="box" x="895" y="520" width="300" height="130"/>
<text x="915" y="551" class="head">Contained failure</text>
<text x="915" y="577" class="body">raise · exit · timeout</text>
<text x="915" y="599" class="body">honest model-visible result</text>
<path class="arrow" d="M555 440 L555 480 L205 480 L205 520"/>
<path class="arrow" d="M625 440 L625 520"/>
<path class="arrow" d="M695 440 L695 480 L1045 480 L1045 520"/>
<path class="dash" d="M205 650 L205 705 L625 705 L625 650"/>
<text x="630" y="697" class="small">results return to bounded runtime</text>
<path class="dash" d="M625 650 L625 705 L1045 705 L1045 650"/>
<text x="1050" y="697" class="small">effects/failures remain explicit</text>
</svg>
