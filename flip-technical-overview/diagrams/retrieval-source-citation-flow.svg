<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Retrieval, evidence, and citation flow</title>
<desc id="desc">External, internal, document, and structured-data retrieval converge on durable source identities and claim-adjacent citations.</desc>
<defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
          </marker>
          <style>
            .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
            .soft{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:16}
            .decision{fill:#fff;stroke:#30343b;stroke-width:2}
            .title{font:700 25px Arial,sans-serif;fill:#17191d}
            .head{font:700 16px Arial,sans-serif;fill:#20242a}
            .body{font:14px Arial,sans-serif;fill:#454b55}
            .small{font:12px Arial,sans-serif;fill:#555d68}
            .label{font:700 12px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
            .arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
            .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
            .line{stroke:#30343b;stroke-width:2;fill:none}
          </style>
        </defs>
<rect class="bg" width="1320" height="760"/>
<text x="45" y="45" class="title">Retrieval, evidence, and citation flow</text>
<rect class="box" x="55" y="95" width="260" height="100"/>
<text x="75" y="126" class="head">Question</text>
<text x="75" y="152" class="body">product context + actor scope</text>
<rect class="soft" x="390" y="80" width="260" height="130"/>
<text x="410" y="111" class="head">Retrieval selection</text>
<text x="410" y="137" class="body">external web</text>
<text x="410" y="159" class="body">internal product</text>
<text x="410" y="181" class="body">document/PDF</text>
<text x="410" y="203" class="body">structured data</text>
<rect class="box" x="725" y="80" width="260" height="130"/>
<text x="745" y="111" class="head">Direct retrieval</text>
<text x="745" y="137" class="body">read actual source</text>
<text x="745" y="159" class="body">authorized records</text>
<text x="745" y="181" class="body">typed values and metadata</text>
<rect class="box" x="1060" y="80" width="205" height="130"/>
<text x="1080" y="111" class="head">Evidence envelope</text>
<text x="1080" y="137" class="body">source identity</text>
<text x="1080" y="159" class="body">passage / records</text>
<text x="1080" y="181" class="body">warnings</text>
<path class="arrow" d="M315 145 L390 145"/>
<path class="arrow" d="M650 145 L725 145"/>
<path class="arrow" d="M985 145 L1060 145"/>
<rect class="box" x="160" y="335" width="300" height="130"/>
<text x="180" y="366" class="head">Passage / record selection</text>
<text x="180" y="392" class="body">bounded context</text>
<text x="180" y="414" class="body">quote or data support</text>
<rect class="soft" x="510" y="335" width="300" height="130"/>
<text x="530" y="366" class="head">Persist citation identity</text>
<text x="530" y="392" class="body">source metadata · fingerprint</text>
<text x="530" y="414" class="body">visibility · artifact linkage</text>
<rect class="box" x="860" y="335" width="300" height="130"/>
<text x="880" y="366" class="head">AI draft</text>
<text x="880" y="392" class="body">claim contains citation token</text>
<text x="880" y="414" class="body">source disagreement remains visible</text>
<path class="arrow" d="M1162 210 L1162 280 L310 280 L310 335"/>
<path class="arrow" d="M460 400 L510 400"/>
<path class="arrow" d="M810 400 L860 400"/>
<rect class="soft" x="405" y="570" width="500" height="110"/>
<text x="425" y="601" class="head">Validation and reader rendering</text>
<text x="425" y="627" class="body">identity exists · source visible · quote present · ledger rendered</text>
<path class="arrow" d="M1010 465 L1010 520 L655 520 L655 570"/>
</svg>
