<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Retrieval, source reading, and citation flow</title><desc id="desc">Internal product retrieval and external research produce durable evidence that can be validated before a final reply refers to it.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
<style>.h1{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}.band{font:700 15px Inter,Arial,sans-serif;letter-spacing:.8px}.nt{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 13.5px Inter,Arial,sans-serif;fill:#334155}.railtitle{font:700 13px Inter,Arial,sans-serif;fill:#334155;letter-spacing:.5px}.rail{font:400 13px Inter,Arial,sans-serif;fill:#475569}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.drop{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="930" fill="#f8fafc"/>
<text x="70" y="58" class="h1">Retrieval, source reading, and citation flow</text><text x="70" y="88" class="sub">Internal product retrieval and external research produce durable evidence that can be validated before a final reply refers to it.</text>
<rect x="50" y="120" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="155" class="band" fill="#6d28d9">EVIDENCE ACQUISITION</text>
<rect x="50" y="435" width="1400" height="285" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="470" class="band" fill="#15803d">VALIDATION AND USER OUTPUT</text>
<rect x="70.0" y="205" width="206.7" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="86.0" y="236" class="nt">Research question</text>
<text x="86.0" y="263" class="nc">Current actor, origin, task,</text>
<text x="86.0" y="284" class="nc">known references and working budget</text>
<rect x="300.7" y="205" width="206.7" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="316.7" y="236" class="nt">Internal retrieval</text>
<text x="316.7" y="263" class="nc">Authorized product search, direct</text>
<text x="316.7" y="284" class="nc">reads and stable product references</text>
<rect x="531.3" y="205" width="206.7" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="547.3" y="236" class="nt">External discovery</text>
<text x="547.3" y="263" class="nc">Search results identify candidate</text>
<text x="547.3" y="284" class="nc">pages, files and source metadata</text>
<rect x="762.0" y="205" width="206.7" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="778.0" y="236" class="nt">Direct source read</text>
<text x="778.0" y="263" class="nc">Retrieve selected pages, documents,</text>
<text x="778.0" y="284" class="nc">passages, tables or media evidence</text>
<rect x="992.7" y="205" width="206.7" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1008.7" y="236" class="nt">Evidence records</text>
<text x="1008.7" y="263" class="nc">Canonical source identity, content,</text>
<text x="1008.7" y="284" class="nc">selected passages, status and relation</text>
<rect x="1223.3" y="205" width="206.7" height="145" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="1239.3" y="236" class="nt">Analysis and terminal use</text>
<text x="1239.3" y="263" class="nc">Synthesize, calculate or compare,</text>
<text x="1239.3" y="284" class="nc">then cite stored evidence only</text>
<rect x="70.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="86.0" y="551" class="nt">Citation validation</text>
<text x="86.0" y="578" class="nc">Reference exists, belongs to admitted</text>
<text x="86.0" y="599" class="nc">evidence and remains visible</text>
<rect x="416.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="432.0" y="551" class="nt">Reader-facing source view</text>
<text x="432.0" y="578" class="nc">Title, link or product reference,</text>
<text x="432.0" y="599" class="nc">relevant status without private trace</text>
<rect x="762.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="778.0" y="551" class="nt">Administrative activity</text>
<text x="778.0" y="578" class="nc">Tool input class, route, duration,</text>
<text x="778.0" y="599" class="nc">errors and complete source lineage</text>
<rect x="1108.0" y="520" width="322.0" height="145" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
<text x="1124.0" y="551" class="nt">Incomplete evidence</text>
<text x="1124.0" y="578" class="nc">Failed reads and unsupported claims</text>
<text x="1124.0" y="599" class="nc">remain explicit in terminal behavior</text>
