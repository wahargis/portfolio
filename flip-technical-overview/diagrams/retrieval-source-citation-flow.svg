<path class="arrow" d="M738.0 277.5 H758.0"/>
<path class="drop" d="M507.3 277.5 V187.0 H992.7 V277.5"/>
<path class="arrow" d="M968.7 277.5 H988.7"/>
<path class="arrow" d="M1199.3 277.5 H1219.3"/>
<path class="drop" d="M1326.7 350 V430 H231.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H577.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H923.0 V520"/>
<path class="drop" d="M1326.7 350 V430 H1269.0 V520"/>
<rect x="50" y="755" width="1400" height="105" rx="14" fill="#e2e8f0"/><text x="75" y="797" class="railtitle">ACCESS</text><text x="75" y="828" class="rail">Product search does not create a second permission system; later source and product reads perform current authorization.</text>
</svg>