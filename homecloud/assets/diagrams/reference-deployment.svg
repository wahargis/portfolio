<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">HomeCloud reference deployment, August 2026</title>
  <desc id="desc">Flip and HomeCloud applications share a self-hosted runtime backed by PostgreSQL and durable storage. HomeCloud routes local inference and workloads across a four-GPU NVIDIA V100 32 GB pool and a separate NVIDIA A100 Drive 32 GB accelerator, with GPU claims, model services, sandboxes, and remote-provider fallback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.group{fill:#ffffff;stroke:#64748b;stroke-width:2;rx:18}.box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12}.app{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}.control{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:12}.gpu{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:12}.a100{fill:#ecfeff;stroke:#0f766e;stroke-width:2;rx:12}.data{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;rx:12}.external{fill:#f1f5f9;stroke:#475569;stroke-width:2;stroke-dasharray:7 5;rx:12}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#475569;letter-spacing:1.2px}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="55" y="52" class="title">HomeCloud reference deployment — August 2026</text>
  <text x="55" y="80" class="subtitle">A dated implementation topology for the private deployment; the logical platform architecture remains hardware-independent.</text>

  <rect class="group" x="55" y="110" width="1290" height="115"/>
  <text x="80" y="140" class="label">USERS AND CLIENTS</text>
  <rect class="box" x="110" y="160" width="340" height="45"/><text x="180" y="190" class="head">Flip web, desktop, mobile, and PWA</text>
  <rect class="box" x="530" y="160" width="340" height="45"/><text x="618" y="190" class="head">HomeCloud operational interfaces</text>
  <rect class="box" x="950" y="160" width="340" height="45"/><text x="1020" y="190" class="head">Connectors, agents, and research jobs</text>

  <path class="arrow" d="M700 225 L700 265"/>
  <rect class="group" x="55" y="265" width="1290" height="155"/>
  <text x="80" y="295" class="label">SELF-HOSTED APPLICATION LAYER</text>
  <rect class="app" x="95" y="325" width="365" height="62"/>
  <text x="120" y="352" class="head">Flip Phoenix application</text><text x="120" y="374" class="small">community product · AI participant runtime · jobs</text>
  <rect class="app" x="518" y="325" width="365" height="62"/>
  <text x="543" y="352" class="head">HomeCloud Elixir/Phoenix application</text><text x="543" y="374" class="small">routing · agents · research · operations · services</text>
  <rect class="data" x="940" y="325" width="365" height="62"/>
  <text x="965" y="352" class="head">PostgreSQL and durable storage</text><text x="965" y="374" class="small">application state · checkpoints · documents · artifacts</text>

  <path class="arrow" d="M700 420 L700 460"/>
  <rect class="group" x="55" y="460" width="1290" height="145"/>
  <text x="80" y="490" class="label">HOMECLOUD RESOURCE AND EXECUTION CONTROL</text>
  <rect class="control" x="90" y="520" width="280" height="55"/><text x="135" y="554" class="head">Inference and model router</text>
  <rect class="control" x="405" y="520" width="280" height="55"/><text x="477" y="554" class="head">Instance pool and health</text>
  <rect class="control" x="720" y="520" width="280" height="55"/><text x="785" y="554" class="head">GPU claims and scheduler</text>
  <rect class="control" x="1035" y="520" width="280" height="55"/><text x="1102" y="554" class="head">Agent sandboxes and tools</text>
  <path class="arrow" d="M370 547 L405 547"/><path class="arrow" d="M685 547 L720 547"/><path class="arrow" d="M1000 547 L1035 547"/>

  <path class="arrow" d="M700 605 L700 645"/>
  <rect class="group" x="55" y="645" width="930" height="205"/>
  <text x="80" y="675" class="label">LOCAL ACCELERATOR AND MODEL-SERVICE LAYER</text>
  <rect class="gpu" x="90" y="705" width="195" height="58"/><text x="140" y="730" class="head">V100 32 GB</text><text x="124" y="752" class="small">text inference pool</text>
  <rect class="gpu" x="305" y="705" width="195" height="58"/><text x="355" y="730" class="head">V100 32 GB</text><text x="339" y="752" class="small">text inference pool</text>
  <rect class="gpu" x="520" y="705" width="195" height="58"/><text x="570" y="730" class="head">V100 32 GB</text><text x="554" y="752" class="small">text / research work</text>
  <rect class="gpu" x="735" y="705" width="195" height="58"/><text x="785" y="730" class="head">V100 32 GB</text><text x="769" y="752" class="small">text / media work</text>
  <rect class="a100" x="300" y="785" width="420" height="45"/><text x="362" y="814" class="head">Separate NVIDIA A100 Drive 32 GB accelerator</text>
  <text x="95" y="790" class="small">Four-V100 local pool; exact physical interconnect is intentionally not asserted here.</text>

  <rect class="group" x="1020" y="645" width="325" height="205"/>
  <text x="1045" y="675" class="label">EXTERNAL CAPABILITY</text>
  <rect class="external" x="1055" y="710" width="255" height="58"/><text x="1095" y="738" class="head">Hosted model providers</text><text x="1095" y="759" class="small">capability and availability fallback</text>
  <rect class="external" x="1055" y="790" width="255" height="38"/><text x="1112" y="815" class="body">Search and media APIs</text>
  <path class="dash" d="M1055 739 L930 739"/>

  <text x="140" y="882" class="body">Flip can consume HomeCloud-served local inference while retaining its own product authorization, context, tools, and durable content authority.</text>
</svg>
