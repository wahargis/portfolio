<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
  <title id="title">HomeCloud local-first AI platform architecture</title>
  <desc id="desc">Application requests enter a supervised runtime that routes inference, checks out healthy instances, coordinates GPU claims and workload priority, executes agent tools in sandboxes, checkpoints long-running work, and supports documents, connectors, research, and media services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/></marker>
    <style>
      .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}.group{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:18}
      .title{font:700 27px Arial,sans-serif;fill:#17191d}.label{font:700 13px Arial,sans-serif;fill:#30343b;letter-spacing:1px}.head{font:700 18px Arial,sans-serif;fill:#20242a}.body{font:14px Arial,sans-serif;fill:#454b55}.small{font:13px Arial,sans-serif;fill:#555d68}.arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1320" height="860"/>
  <text x="55" y="52" class="title">HomeCloud: local-first AI operations and application runtime</text>

  <rect class="box" x="105" y="88" width="1110" height="88"/>
  <text x="135" y="118" class="label">REQUESTS AND WORKLOADS</text>
  <text x="135" y="148" class="head">interactive applications · connectors · agents · research · documents · media</text>

  <path class="arrow" d="M660 176 L660 220"/>
  <rect class="group" x="65" y="220" width="1190" height="205"/>
  <text x="90" y="250" class="label">INFERENCE AND RESOURCE CONTROL</text>

  <rect class="box" x="95" y="280" width="250" height="110"/>
  <text x="120" y="312" class="head">Route and admit</text>
  <text x="120" y="341" class="body">backend · model · priority</text>
  <text x="120" y="365" class="body">local or remote capability</text>

  <rect class="box" x="385" y="280" width="250" height="110"/>
  <text x="410" y="312" class="head">Instance pool</text>
  <text x="410" y="341" class="body">checkout · affinity · health</text>
  <text x="410" y="365" class="body">restart and multi-slot capacity</text>

  <rect class="box" x="675" y="280" width="250" height="110"/>
  <text x="700" y="312" class="head">GPU authority</text>
  <text x="700" y="341" class="body">claims · queues · idle checks</text>
  <text x="700" y="365" class="body">controlled model lifecycle</text>

  <rect class="box" x="965" y="280" width="250" height="110"/>
  <text x="990" y="312" class="head">Operations</text>
  <text x="990" y="341" class="body">supervision · health · telemetry</text>
  <text x="990" y="365" class="body">configuration and degradation</text>

  <path class="arrow" d="M660 425 L660 470"/>
  <rect class="group" x="65" y="470" width="1190" height="190"/>
  <text x="90" y="500" class="label">AGENT AND RESEARCH EXECUTION</text>

  <rect class="box" x="95" y="535" width="210" height="88"/>
  <text x="120" y="567" class="head">Context</text>
  <text x="120" y="592" class="body">task state · retrieval</text>

  <rect class="box" x="325" y="535" width="210" height="88"/>
  <text x="350" y="567" class="head">Sandbox</text>
  <text x="350" y="592" class="body">workspace · toolchains</text>

  <rect class="box" x="555" y="535" width="210" height="88"/>
  <text x="580" y="567" class="head">Tool loop</text>
  <text x="580" y="592" class="body">dispatch · loop safety</text>

  <rect class="box" x="785" y="535" width="210" height="88"/>
  <text x="810" y="567" class="head">Checkpoint</text>
  <text x="810" y="592" class="body">history · plan · engine state</text>

  <rect class="box" x="1015" y="535" width="210" height="88"/>
  <text x="1040" y="567" class="head">Verify and persist</text>
  <text x="1040" y="592" class="body">results · evidence · lifecycle</text>

  <path class="arrow" d="M660 660 L660 705"/>
  <rect class="group" x="105" y="705" width="1110" height="105"/>
  <text x="135" y="735" class="label">SHARED APPLICATION SERVICES</text>
  <text x="135" y="766" class="head">document vault · browser/search · connectors · model installation · OCR · media/cinema · UI</text>
  <text x="135" y="792" class="small">The services reuse one supervised resource, inference, execution, and persistence substrate.</text>
</svg>
