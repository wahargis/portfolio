<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
  <title id="title">HomeCloud supervised AI operations architecture</title>
  <desc id="desc">Application, connector, agent, research, document, and media requests enter a supervised Elixir runtime. Inference routing, instance capacity, GPU claims, model-service scheduling, sandboxed agent execution, context and tools, checkpoints, persistence, telemetry, and application services share one operational substrate.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.group{fill:#ffffff;stroke:#64748b;stroke-width:2;rx:18}.box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12}.resource{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}.agent{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;rx:12}.ops{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:12}.service{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:12}.state{fill:#ecfeff;stroke:#0f766e;stroke-width:2;rx:12}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#475569;letter-spacing:1.2px}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="960"/>
  <text x="55" y="52" class="title">HomeCloud: supervised local-first AI operations and agent execution</text>
  <text x="55" y="80" class="subtitle">Application behavior is admitted against actual model, accelerator, process, and workspace state.</text>

  <rect class="group" x="55" y="110" width="1290" height="120"/>
  <text x="80" y="140" class="label">REQUEST SOURCES</text>
  <rect class="box" x="90" y="160" width="280" height="48"/><text x="150" y="191" class="head">LiveView applications</text>
  <rect class="box" x="405" y="160" width="280" height="48"/><text x="470" y="191" class="head">Connectors, MCP, and API</text>
  <rect class="box" x="720" y="160" width="280" height="48"/><text x="790" y="191" class="head">Agents and automation</text>
  <rect class="box" x="1035" y="160" width="280" height="48"/><text x="1085" y="191" class="head">Research and media jobs</text>

  <path class="arrow" d="M700 230 L700 270"/>
  <rect class="group" x="55" y="270" width="1290" height="125"/>
  <text x="80" y="300" class="label">OTP APPLICATION AND ADMISSION</text>
  <rect class="ops" x="90" y="325" width="385" height="48"/><text x="165" y="356" class="head">Supervision, configuration, health, and lifecycle</text>
  <rect class="ops" x="507" y="325" width="385" height="48"/><text x="565" y="356" class="head">Workload type, priority, and capability policy</text>
  <rect class="ops" x="925" y="325" width="385" height="48"/><text x="1005" y="356" class="head">Telemetry, audit, and degraded-state reporting</text>

  <path class="arrow" d="M455 395 L455 435"/>
  <path class="arrow" d="M945 395 L945 435"/>

  <rect class="group" x="55" y="435" width="640" height="300"/>
  <text x="80" y="465" class="label">INFERENCE AND RESOURCE CONTROL</text>
  <rect class="resource" x="90" y="500" width="270" height="82"/>
  <text x="115" y="530" class="head">Inference router</text><text x="115" y="554" class="body">model profile · backend</text><text x="115" y="574" class="small">local or remote execution path</text>
  <rect class="resource" x="395" y="500" width="265" height="82"/>
  <text x="420" y="530" class="head">Instance pool</text><text x="420" y="554" class="body">checkout · affinity · health</text><text x="420" y="574" class="small">priority queue · restart · slots</text>
  <path class="arrow" d="M360 541 L395 541"/>
  <rect class="resource" x="90" y="625" width="270" height="82"/>
  <text x="115" y="655" class="head">GPU claim authority</text><text x="115" y="679" class="body">ownership · locks · demand</text><text x="115" y="699" class="small">admission against real capacity</text>
  <rect class="resource" x="395" y="625" width="265" height="82"/>
  <text x="420" y="655" class="head">Workload scheduler</text><text x="420" y="679" class="body">idle checks · cooldown</text><text x="420" y="699" class="small">service spool and baseline return</text>
  <path class="arrow" d="M527 582 L527 625"/><path class="arrow" d="M360 666 L395 666"/>

  <rect class="group" x="730" y="435" width="615" height="300"/>
  <text x="755" y="465" class="label">AGENT AND RESEARCH EXECUTION</text>
  <rect class="agent" x="765" y="500" width="250" height="82"/>
  <text x="790" y="530" class="head">Execution engine</text><text x="790" y="554" class="body">autonomous · interactive</text><text x="790" y="574" class="small">plan-only · phases · streaming</text>
  <rect class="agent" x="1050" y="500" width="260" height="82"/>
  <text x="1075" y="530" class="head">Context and tools</text><text x="1075" y="554" class="body">retrieval · profiles · registry</text><text x="1075" y="574" class="small">loop and validation controls</text>
  <path class="arrow" d="M1015 541 L1050 541"/>
  <rect class="agent" x="765" y="625" width="250" height="82"/>
  <text x="790" y="655" class="head">Agent sandbox</text><text x="790" y="679" class="body">container · durable workspace</text><text x="790" y="699" class="small">toolchains · path validation</text>
  <rect class="agent" x="1050" y="625" width="260" height="82"/>
  <text x="1075" y="655" class="head">Checkpoint and verify</text><text x="1075" y="679" class="body">history · plan · loop · events</text><text x="1075" y="699" class="small">resume · result · evidence</text>
  <path class="arrow" d="M890 582 L890 625"/><path class="arrow" d="M1015 666 L1050 666"/>

  <path class="arrow" d="M700 735 L700 775"/>
  <rect class="group" x="55" y="775" width="1290" height="135"/>
  <text x="80" y="805" class="label">SHARED APPLICATION SERVICES AND STATE</text>
  <rect class="service" x="90" y="835" width="280" height="50"/><text x="135" y="866" class="head">Documents, browser, search</text>
  <rect class="service" x="405" y="835" width="280" height="50"/><text x="466" y="866" class="head">Research and evaluation</text>
  <rect class="service" x="720" y="835" width="280" height="50"/><text x="795" y="866" class="head">OCR, image, video, audio</text>
  <rect class="state" x="1035" y="835" width="280" height="50"/><text x="1075" y="866" class="head">Ash / PostgreSQL / PubSub</text>

  <text x="235" y="938" class="body">Local model servers, accelerator pools, remote providers, containers, and system services remain observable runtime resources rather than hidden assumptions.</text>
</svg>
