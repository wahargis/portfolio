<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
  <title id="title">HomeCloud runtime architecture</title>
  <desc id="desc">Applications and agents enter a HomeCloud execution lifecycle that coordinates durable context, owned sandboxes, inference routing, supervised services, lower-priority research, and heterogeneous local hardware.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/></marker>
    <style>
      .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}.group{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:18}.research{fill:#fff;stroke:#646b75;stroke-width:2;stroke-dasharray:8 6;rx:14}
      .title{font:700 26px Arial,sans-serif;fill:#17191d}.head{font:700 17px Arial,sans-serif;fill:#20242a}.body{font:14px Arial,sans-serif;fill:#454b55}.label{font:700 13px Arial,sans-serif;fill:#30343b;letter-spacing:1px}.small{font:12px Arial,sans-serif;fill:#555d68}.arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1320" height="900"/>
  <text x="55" y="50" class="title">HomeCloud: supervised inference and recoverable local AI execution</text>

  <rect class="group" x="55" y="85" width="1210" height="105"/>
  <text x="80" y="115" class="label">APPLICATIONS AND OPERATORS</text>
  <rect class="box" x="90" y="132" width="310" height="42"/><text x="145" y="160" class="head">Flip / APIs / interactive clients</text>
  <rect class="box" x="505" y="132" width="310" height="42"/><text x="553" y="160" class="head">Autonomous and interactive agents</text>
  <rect class="box" x="920" y="132" width="310" height="42"/><text x="982" y="160" class="head">Operator / MCP / connectors</text>

  <path class="arrow" d="M660 190 L660 235"/>

  <rect class="group" x="55" y="235" width="850" height="300"/>
  <text x="80" y="267" class="label">HOMECLOUD RUNTIME</text>
  <rect class="box" x="85" y="300" width="370" height="100"/>
  <text x="110" y="332" class="head">Execution lifecycle</text><text x="110" y="358" class="body">admission · phases · checkpoints · recovery</text>
  <rect class="box" x="500" y="300" width="370" height="100"/>
  <text x="525" y="332" class="head">Inference control</text><text x="525" y="358" class="body">profile · priority · affinity · live capacity</text>
  <rect class="box" x="85" y="430" width="370" height="80"/>
  <text x="110" y="462" class="head">Durable context</text><text x="110" y="488" class="body">retrieval · task memory · selected knowledge</text>
  <rect class="box" x="500" y="430" width="370" height="80"/>
  <text x="525" y="462" class="head">Owned execution</text><text x="525" y="488" class="body">sandbox · tools · artifacts · cleanup</text>

  <rect class="research" x="950" y="235" width="315" height="300"/>
  <text x="975" y="267" class="label">RESEARCH WORKLOADS</text>
  <text x="975" y="315" class="head">Program and agent search</text>
  <text x="975" y="343" class="body">candidate trials under scheduler policy</text>
  <text x="975" y="392" class="head">Code and CUDA evaluation</text>
  <text x="975" y="420" class="body">compile · test · correctness · profile</text>
  <text x="975" y="482" class="small">Consumers of the runtime, not the runtime’s authority</text>
  <path class="dash" d="M950 385 L905 385"/>

  <path class="arrow" d="M660 535 L660 580"/>
  <rect class="group" x="55" y="580" width="1210" height="145"/>
  <text x="80" y="612" class="label">SUPERVISED SERVICES</text>
  <rect class="box" x="85" y="640" width="215" height="60"/><text x="112" y="676" class="head">PostgreSQL + pgvector</text>
  <rect class="box" x="325" y="640" width="215" height="60"/><text x="357" y="676" class="head">Model pool + slots</text>
  <rect class="box" x="565" y="640" width="215" height="60"/><text x="601" y="676" class="head">GPU claims + scheduler</text>
  <rect class="box" x="805" y="640" width="215" height="60"/><text x="847" y="676" class="head">Sandbox supervision</text>
  <rect class="box" x="1045" y="640" width="190" height="60"/><text x="1081" y="676" class="head">Health + telemetry</text>

  <path class="arrow" d="M660 725 L660 770"/>
  <rect class="group" x="125" y="770" width="1070" height="105"/>
  <text x="150" y="802" class="label">HETEROGENEOUS LOCAL HARDWARE</text>
  <rect class="box" x="160" y="820" width="365" height="38"/><text x="208" y="846" class="head">4 × V100 32 GB · NVLink pool · 128 GB</text>
  <rect class="box" x="555" y="820" width="300" height="38"/><text x="603" y="846" class="head">A100 Drive 32 GB · separate</text>
  <rect class="box" x="885" y="820" width="275" height="38"/><text x="925" y="846" class="head">Optional compatible remote route</text>
</svg>