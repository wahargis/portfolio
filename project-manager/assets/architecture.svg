<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Project Manager research operations architecture</title>
  <desc id="desc">CLI, MCP, and web interfaces share one Rust application. Portfolio planning, experiment and evidence workflows, hypothesis and decision lifecycles, session context, and review services use deterministic DAG, graph, truth-maintenance, retrieval, and validation engines over one versioned SQLite store.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.group{fill:#ffffff;stroke:#64748b;stroke-width:2;rx:18}.box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12}.service{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}.engine{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;rx:12}.store{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:14}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#475569;letter-spacing:1.2px}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="55" y="52" class="title">Project Manager: research operations and durable project state</text>
  <text x="55" y="80" class="subtitle">Planning, evidence, decisions, context, and integrity checks operate on one typed project record.</text>

  <rect class="group" x="55" y="110" width="1290" height="115"/>
  <text x="80" y="140" class="label">INTERFACES</text>
  <rect class="box" x="95" y="158" width="340" height="45"/><text x="235" y="188" class="head">CLI</text>
  <rect class="box" x="530" y="158" width="340" height="45"/><text x="665" y="188" class="head">MCP stdio</text>
  <rect class="box" x="965" y="158" width="340" height="45"/><text x="1080" y="188" class="head">Web dashboard</text>

  <path class="arrow" d="M700 225 L700 265"/>
  <rect class="group" x="55" y="265" width="1290" height="235"/>
  <text x="80" y="295" class="label">APPLICATION WORKFLOWS</text>
  <rect class="service" x="85" y="325" width="230" height="135"/>
  <text x="110" y="355" class="head">Portfolio and phases</text><text x="110" y="382" class="body">projects · subprojects</text><text x="110" y="405" class="body">dependencies · impact</text><text x="110" y="428" class="small">actionable work and completion gates</text>
  <rect class="service" x="335" y="325" width="230" height="135"/>
  <text x="360" y="355" class="head">Experiments and evidence</text><text x="360" y="382" class="body">experiments · findings</text><text x="360" y="405" class="body">branches · convergence</text><text x="360" y="428" class="small">causal upstream requirements</text>
  <rect class="service" x="585" y="325" width="230" height="135"/>
  <text x="610" y="355" class="head">Interpretation</text><text x="610" y="382" class="body">hypotheses · decisions</text><text x="610" y="405" class="body">literature · principles</text><text x="610" y="428" class="small">confidence and belief lifecycle</text>
  <rect class="service" x="835" y="325" width="230" height="135"/>
  <text x="860" y="355" class="head">Session continuity</text><text x="860" y="382" class="body">active experiment</text><text x="860" y="405" class="body">temporal delta · handoff</text><text x="860" y="428" class="small">bounded active-phase context</text>
  <rect class="service" x="1085" y="325" width="230" height="135"/>
  <text x="1110" y="355" class="head">Review and repair</text><text x="1110" y="382" class="body">operational review</text><text x="1110" y="405" class="body">graph audit · orphan repair</text><text x="1110" y="428" class="small">contradictions and stale state</text>

  <path class="arrow" d="M700 500 L700 540"/>
  <rect class="group" x="55" y="540" width="1290" height="170"/>
  <text x="80" y="570" class="label">SHARED RUST ENGINES</text>
  <rect class="engine" x="85" y="600" width="280" height="78"/>
  <text x="110" y="630" class="head">Execution DAG</text><text x="110" y="654" class="body">topology · ready phases · stagnation</text>
  <rect class="engine" x="395" y="600" width="280" height="78"/>
  <text x="420" y="630" class="head">Graph and truth maintenance</text><text x="420" y="654" class="body">typed traversal · support · contradiction</text>
  <rect class="engine" x="705" y="600" width="280" height="78"/>
  <text x="730" y="630" class="head">Retrieval and context</text><text x="730" y="654" class="body">ranked search · subgraphs · temporal delta</text>
  <rect class="engine" x="1015" y="600" width="300" height="78"/>
  <text x="1040" y="630" class="head">Lifecycle validation</text><text x="1040" y="654" class="body">causal guards · transitions · consistency</text>

  <path class="arrow" d="M700 710 L700 750"/>
  <rect class="store" x="130" y="750" width="1140" height="105"/>
  <text x="575" y="785" class="head">Versioned SQLite project store</text>
  <text x="225" y="817" class="body">projects · phases · experiments · findings · hypotheses · decisions · literature · constraints · principles · feedback · sessions</text>
  <text x="260" y="842" class="small">typed relationships · timestamps · belief state · migrations · interface-independent application semantics</text>
</svg>
