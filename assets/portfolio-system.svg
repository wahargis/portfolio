<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Execution paths across the four portfolio projects</title>
  <desc id="desc">Four independent engineering flows show how Flip, Project Manager, Baton, and HomeCloud turn product or operator requests into controlled, durable system state.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 24px Inter, Arial, sans-serif; fill: #0f172a; }
      .lane-sub { font: 400 15px Inter, Arial, sans-serif; fill: #334155; }
      .node-title { font: 700 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-copy { font: 400 14px Inter, Arial, sans-serif; fill: #334155; }
      .rail-label { font: 700 13px Inter, Arial, sans-serif; fill: #334155; letter-spacing: .3px; }
      .rail-copy { font: 400 13px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="#f8fafc"/>
  <text x="70" y="66" class="title">Four independent AI systems and their execution paths</text>
  <text x="70" y="98" class="subtitle">Each lane follows a representative request through agent work, software control, durable state, and recovery.</text>

  <!-- Flip lane -->
  <g transform="translate(55 140)">
    <rect x="0" y="0" width="1490" height="225" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="225" rx="18" fill="#e0f2fe"/>
    <path d="M212 0 h18 v225 h-18" fill="#e0f2fe"/>
    <text x="28" y="48" class="lane-title">Flip</text>
    <text x="28" y="78" class="lane-sub">Product-integrated</text>
    <text x="28" y="100" class="lane-sub">agent runtime</text>
    <text x="28" y="139" class="lane-sub">Community product,</text>
    <text x="28" y="161" class="lane-sub">research, tools,</text>
    <text x="28" y="183" class="lane-sub">media, and curation</text>

    <g transform="translate(270 25)">
      <rect width="205" height="108" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="18" y="32" class="node-title">Product event</text>
      <text x="18" y="58" class="node-copy">Message, reply,</text><text x="18" y="78" class="node-copy">curation, document,</text><text x="18" y="98" class="node-copy">data, or media task</text>
    </g>
    <path class="arrow" d="M475 79 H505"/>
    <g transform="translate(510 25)">
      <rect width="205" height="108" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="18" y="32" class="node-title">Scope and context</text>
      <text x="18" y="58" class="node-copy">Actor, membership,</text><text x="18" y="78" class="node-copy">room or forum,</text><text x="18" y="98" class="node-copy">eligible product state</text>
    </g>
    <path class="arrow" d="M715 79 H745"/>
    <g transform="translate(750 25)">
      <rect width="205" height="108" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="18" y="32" class="node-title">Agent execution</text>
      <text x="18" y="58" class="node-copy">Retrieval, route,</text><text x="18" y="78" class="node-copy">tool loop, evidence,</text><text x="18" y="98" class="node-copy">and effect requests</text>
    </g>
    <path class="arrow" d="M955 79 H985"/>
    <g transform="translate(990 25)">
      <rect width="205" height="108" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="18" y="32" class="node-title">Product commit</text>
      <text x="18" y="58" class="node-copy">Reply, citation,</text><text x="18" y="78" class="node-copy">action, artifact, or</text><text x="18" y="98" class="node-copy">forum state</text>
    </g>
    <path class="arrow" d="M1195 79 H1225"/>
    <g transform="translate(1230 25)">
      <rect width="205" height="108" rx="12" fill="#f0f9ff" stroke="#7dd3fc"/>
      <text x="18" y="32" class="node-title">Client state</text>
      <text x="18" y="58" class="node-copy">Durable sync,</text><text x="18" y="78" class="node-copy">realtime events,</text><text x="18" y="98" class="node-copy">failure or continuation</text>
    </g>
    <rect x="270" y="154" width="1165" height="45" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="288" y="181" class="rail-label">DURABLE STATE</text>
    <text x="410" y="181" class="rail-copy">messages · forum objects · AI activity · tool calls · citations · artifacts · synthesis runs · jobs</text>
  </g>

  <!-- Project Manager lane -->
  <g transform="translate(55 385)">
    <rect x="0" y="0" width="1490" height="225" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="225" rx="18" fill="#ede9fe"/>
    <path d="M212 0 h18 v225 h-18" fill="#ede9fe"/>
    <text x="28" y="48" class="lane-title">Project Manager</text>
    <text x="28" y="78" class="lane-sub">Project reasoning,</text>
    <text x="28" y="100" class="lane-sub">continuity, and</text>
    <text x="28" y="122" class="lane-sub">execution state</text>

    <g transform="translate(270 25)"><rect width="205" height="108" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="32" class="node-title">Project input</text><text x="18" y="58" class="node-copy">Experiment, finding,</text><text x="18" y="78" class="node-copy">decision, constraint,</text><text x="18" y="98" class="node-copy">phase, or handoff</text></g>
    <path class="arrow" d="M475 79 H505"/>
    <g transform="translate(510 25)"><rect width="205" height="108" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="32" class="node-title">Typed project state</text><text x="18" y="58" class="node-copy">Objects, causal links,</text><text x="18" y="78" class="node-copy">branches, provenance,</text><text x="18" y="98" class="node-copy">and temporal changes</text></g>
    <path class="arrow" d="M715 79 H745"/>
    <g transform="translate(750 25)"><rect width="205" height="108" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="32" class="node-title">Review and retrieval</text><text x="18" y="58" class="node-copy">Graph context,</text><text x="18" y="78" class="node-copy">contradiction, confidence,</text><text x="18" y="98" class="node-copy">and stale-state checks</text></g>
    <path class="arrow" d="M955 79 H985"/>
    <g transform="translate(990 25)"><rect width="205" height="108" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="32" class="node-title">Execution DAG</text><text x="18" y="58" class="node-copy">Completed dependencies,</text><text x="18" y="78" class="node-copy">ready phases, impact,</text><text x="18" y="98" class="node-copy">and invalid cycles</text></g>
    <path class="arrow" d="M1195 79 H1225"/>
    <g transform="translate(1230 25)"><rect width="205" height="108" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="32" class="node-title">Next session</text><text x="18" y="58" class="node-copy">Current project state,</text><text x="18" y="78" class="node-copy">active work, evidence,</text><text x="18" y="98" class="node-copy">and explicit handoff</text></g>
    <rect x="270" y="154" width="1165" height="45" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="288" y="181" class="rail-label">DURABLE STATE</text>
    <text x="410" y="181" class="rail-copy">typed nodes and edges · causal and branch history · review results · sessions · phase state · retrieval context</text>
  </g>

  <!-- Baton lane -->
  <g transform="translate(55 630)">
    <rect x="0" y="0" width="1490" height="225" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="225" rx="18" fill="#dcfce7"/>
    <path d="M212 0 h18 v225 h-18" fill="#dcfce7"/>
    <text x="28" y="48" class="lane-title">Baton</text>
    <text x="28" y="78" class="lane-sub">Persistent coding-agent</text>
    <text x="28" y="100" class="lane-sub">fleet control</text>
    <text x="28" y="139" class="lane-sub">Runs, waves, routes,</text>
    <text x="28" y="161" class="lane-sub">sessions, context,</text>
    <text x="28" y="183" class="lane-sub">workspaces, and results</text>

    <g transform="translate(270 25)"><rect width="205" height="108" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="node-title">Approved contract</text><text x="18" y="58" class="node-copy">Goal, plan, scope,</text><text x="18" y="78" class="node-copy">budgets, dependencies,</text><text x="18" y="98" class="node-copy">and verification</text></g>
    <path class="arrow" d="M475 79 H505"/>
    <g transform="translate(510 25)"><rect width="205" height="108" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="node-title">Run scheduling</text><text x="18" y="58" class="node-copy">Dependency-ready nodes,</text><text x="18" y="78" class="node-copy">waves, workflows,</text><text x="18" y="98" class="node-copy">and resource limits</text></g>
    <path class="arrow" d="M715 79 H745"/>
    <g transform="translate(750 25)"><rect width="205" height="108" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="node-title">Harness fleet</text><text x="18" y="58" class="node-copy">Exact routes, persistent</text><text x="18" y="78" class="node-copy">sessions, interactions,</text><text x="18" y="98" class="node-copy">events, and steering</text></g>
    <path class="arrow" d="M955 79 H985"/>
    <g transform="translate(990 25)"><rect width="205" height="108" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="node-title">Owned work</text><text x="18" y="58" class="node-copy">Shared context,</text><text x="18" y="78" class="node-copy">isolated worktrees,</text><text x="18" y="98" class="node-copy">captured candidates</text></g>
    <path class="arrow" d="M1195 79 H1225"/>
    <g transform="translate(1230 25)"><rect width="205" height="108" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="node-title">Result authority</text><text x="18" y="58" class="node-copy">Evidence, review,</text><text x="18" y="78" class="node-copy">adoption, integration,</text><text x="18" y="98" class="node-copy">and cleanup</text></g>
    <rect x="270" y="154" width="1165" height="45" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="288" y="181" class="rail-label">DURABLE STATE</text>
    <text x="410" y="181" class="rail-copy">runs · plans · routes · sessions · interactions · events · context · workspaces · candidate results · evidence</text>
  </g>

  <!-- HomeCloud lane -->
  <g transform="translate(55 875)">
    <rect x="0" y="0" width="1490" height="225" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="225" rx="18" fill="#ffedd5"/>
    <path d="M212 0 h18 v225 h-18" fill="#ffedd5"/>
    <text x="28" y="48" class="lane-title">HomeCloud</text>
    <text x="28" y="78" class="lane-sub">Supervised local AI</text>
    <text x="28" y="100" class="lane-sub">application runtime</text>
    <text x="28" y="139" class="lane-sub">Models, GPU capacity,</text>
    <text x="28" y="161" class="lane-sub">agents, tools, research,</text>
    <text x="28" y="183" class="lane-sub">documents, and media</text>

    <g transform="translate(270 25)"><rect width="205" height="108" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="node-title">Workload request</text><text x="18" y="58" class="node-copy">Interactive, agent,</text><text x="18" y="78" class="node-copy">research, document,</text><text x="18" y="98" class="node-copy">connector, or media</text></g>
    <path class="arrow" d="M475 79 H505"/>
    <g transform="translate(510 25)"><rect width="205" height="108" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="node-title">Admission</text><text x="18" y="58" class="node-copy">Priority, route, healthy</text><text x="18" y="78" class="node-copy">instance, GPU claim,</text><text x="18" y="98" class="node-copy">and queue state</text></g>
    <path class="arrow" d="M715 79 H745"/>
    <g transform="translate(750 25)"><rect width="205" height="108" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="node-title">Execution setup</text><text x="18" y="58" class="node-copy">Context, tool profile,</text><text x="18" y="78" class="node-copy">model instance, mode,</text><text x="18" y="98" class="node-copy">and sandbox</text></g>
    <path class="arrow" d="M955 79 H985"/>
    <g transform="translate(990 25)"><rect width="205" height="108" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="node-title">Agent and tools</text><text x="18" y="58" class="node-copy">Model turns, tool calls,</text><text x="18" y="78" class="node-copy">loop and quality checks,</text><text x="18" y="98" class="node-copy">events, and checkpoints</text></g>
    <path class="arrow" d="M1195 79 H1225"/>
    <g transform="translate(1230 25)"><rect width="205" height="108" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="node-title">Persist and release</text><text x="18" y="58" class="node-copy">Application result,</text><text x="18" y="78" class="node-copy">resumable state, health,</text><text x="18" y="98" class="node-copy">and capacity reconciliation</text></g>
    <rect x="270" y="154" width="1165" height="45" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="288" y="181" class="rail-label">DURABLE STATE</text>
    <text x="410" y="181" class="rail-copy">model instances · queues · GPU claims · agent tasks · messages · plans · tools · checkpoints · research and artifact records</text>
  </g>
</svg>
