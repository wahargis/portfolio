<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI systems portfolio architecture</title>
  <desc id="desc">Four independently useful planes: Flip product, Project Manager knowledge, Baton control, and HomeCloud compute, connected by narrow integration contracts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
    </marker>
    <style>
      .bg { fill: #fbfbfc; }
      .box { fill: #ffffff; stroke: #30343b; stroke-width: 2; rx: 16; }
      .title { font: 700 27px Arial, sans-serif; fill: #17191d; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #30343b; }
      .body { font: 15px Arial, sans-serif; fill: #454b55; }
      .label { font: 700 14px Arial, sans-serif; fill: #17191d; letter-spacing: 1px; }
      .arrow { stroke: #30343b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #646b75; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .caption { font: 13px Arial, sans-serif; fill: #555d68; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>

  <text x="60" y="55" class="title">Product, knowledge, control, and compute</text>
  <text x="60" y="84" class="body">Independent systems with explicit authority boundaries and composable interfaces</text>

  <rect class="box" x="70" y="125" width="480" height="215"/>
  <text x="100" y="160" class="label">PRODUCT PLANE</text>
  <text x="100" y="197" class="title">Flip</text>
  <text x="100" y="229" class="subtitle">Human collaboration + bounded AI participation</text>
  <text x="100" y="263" class="body">Chat · forum · synthesis · retrieval · tools</text>
  <text x="100" y="288" class="body">provenance · artifacts · real-time/native clients</text>
  <text x="100" y="319" class="caption">Owns users, content, permissions, and product semantics</text>

  <rect class="box" x="650" y="125" width="480" height="215"/>
  <text x="680" y="160" class="label">KNOWLEDGE PLANE</text>
  <text x="680" y="197" class="title">Project Manager</text>
  <text x="680" y="229" class="subtitle">Evidence-aware institutional memory</text>
  <text x="680" y="263" class="body">Typed evidence graph · DAG · belief revision</text>
  <text x="680" y="288" class="body">causal decisions · review · session continuity</text>
  <text x="680" y="319" class="caption">Owns project belief, rationale, and next-action state</text>

  <rect class="box" x="70" y="435" width="480" height="215"/>
  <text x="100" y="470" class="label">CONTROL PLANE</text>
  <text x="100" y="507" class="title">Baton</text>
  <text x="100" y="539" class="subtitle">Deterministic orchestration for coding agents</text>
  <text x="100" y="573" class="body">Lifecycle · fencing · waves · steering · worktrees</text>
  <text x="100" y="598" class="body">event truth · recovery · verification · adoption</text>
  <text x="100" y="629" class="caption">Owns worker authority, evidence, and source effects</text>

  <rect class="box" x="650" y="435" width="480" height="215"/>
  <text x="680" y="470" class="label">COMPUTE / RUNTIME PLANE</text>
  <text x="680" y="507" class="title">HomeCloud</text>
  <text x="680" y="539" class="subtitle">Self-hosted inference and agent runtime</text>
  <text x="680" y="573" class="body">Model pools · GPU slots · scheduling · sandboxes</text>
  <text x="680" y="598" class="body">RAG · memory · compaction · checkpoints · evaluation</text>
  <text x="680" y="629" class="caption">Owns model capacity, execution isolation, and recovery</text>

  <path class="dash" d="M550 232 C590 232 610 232 650 232"/>
  <text x="560" y="215" class="caption">durable artifacts</text>

  <path class="dash" d="M310 340 C310 377 310 398 310 435"/>
  <text x="326" y="390" class="caption">controlled source work</text>

  <path class="dash" d="M550 542 C590 542 610 542 650 542"/>
  <text x="558" y="525" class="caption">execution capacity</text>

  <path class="dash" d="M890 435 C890 393 890 382 890 340"/>
  <text x="908" y="390" class="caption">findings / handoffs</text>

  <path class="dash" d="M470 340 C540 395 620 405 710 435"/>
  <text x="508" y="410" class="caption">model endpoint</text>

  <text x="70" y="711" class="caption">Dashed arrows are optional integration contracts. No project must absorb another project’s authority.</text>
</svg>
