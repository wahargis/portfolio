<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Four independent AI systems</title>
  <desc id="desc">Flip, Project Manager, Baton, and HomeCloud are independent systems that share an engineering focus on explicit state, authority, provenance, and recovery.</desc>
  <defs>
    <style>
      .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:16}.band{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:14}
      .title{font:700 28px Arial,sans-serif;fill:#17191d}.subtitle{font:16px Arial,sans-serif;fill:#454b55}
      .label{font:700 13px Arial,sans-serif;fill:#30343b;letter-spacing:1px}.head{font:700 24px Arial,sans-serif;fill:#17191d}
      .body{font:15px Arial,sans-serif;fill:#454b55}.small{font:13px Arial,sans-serif;fill:#555d68}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="60" y="54" class="title">Four independent systems; one engineering approach</text>
  <text x="60" y="82" class="subtitle">Each project owns a different user problem and can be reviewed or deployed on its own.</text>

  <rect class="box" x="65" y="120" width="510" height="225"/>
  <text x="95" y="154" class="label">COMMUNITY PRODUCT</text>
  <text x="95" y="195" class="head">Flip</text>
  <text x="95" y="227" class="body">Live conversation, durable forum knowledge,</text>
  <text x="95" y="251" class="body">and scoped AI participation in one product.</text>
  <text x="95" y="292" class="small">Central contract: identity, audience, authorship,</text>
  <text x="95" y="315" class="small">context, provenance, and durable publication.</text>

  <rect class="box" x="625" y="120" width="510" height="225"/>
  <text x="655" y="154" class="label">PROJECT MEMORY AND CONTROL</text>
  <text x="655" y="195" class="head">Project Manager</text>
  <text x="655" y="227" class="body">Typed evidence, decisions, contradictions,</text>
  <text x="655" y="251" class="body">dependencies, and cross-session orientation.</text>
  <text x="655" y="292" class="small">Central contract: evidence relationships remain</text>
  <text x="655" y="315" class="small">distinct from deterministic phase scheduling.</text>

  <rect class="box" x="65" y="385" width="510" height="225"/>
  <text x="95" y="419" class="label">CODING-AGENT DELIVERY CONTROL</text>
  <text x="95" y="460" class="head">Baton</text>
  <text x="95" y="492" class="body">Validated intent, persistent harness sessions,</text>
  <text x="95" y="516" class="body">isolated worktrees, verification, and adoption.</text>
  <text x="95" y="557" class="small">Central contract: workers implement; the control</text>
  <text x="95" y="580" class="small">plane retains scope and lifecycle authority.</text>

  <rect class="box" x="625" y="385" width="510" height="225"/>
  <text x="655" y="419" class="label">LOCAL AI OPERATIONS PLATFORM</text>
  <text x="655" y="460" class="head">HomeCloud</text>
  <text x="655" y="492" class="body">Model lifecycle, finite GPU capacity, sandboxed</text>
  <text x="655" y="516" class="body">agents, checkpoints, research, and app services.</text>
  <text x="655" y="557" class="small">Central contract: route and prioritize work against</text>
  <text x="655" y="580" class="small">real infrastructure state and recoverable execution.</text>

  <rect class="band" x="170" y="652" width="860" height="68"/>
  <text x="245" y="680" class="label">SHARED ENGINEERING THEMES</text>
  <text x="245" y="706" class="body">explicit state · bounded authority · provenance · recovery · shared semantics across interfaces</text>
</svg>
