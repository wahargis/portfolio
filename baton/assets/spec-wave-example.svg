<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Baton recorded two-member specification wave, August 6 2026</title>
  <desc id="desc">A public Baton evidence run started two DeepSeek workers with separate roles and scopes. Both reached work_completed, the loop drained, one content-addressed result was harvested, the other was missing, and the workflow correctly ended SPEC-WAVE-INCOMPLETE.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.group{fill:#ffffff;stroke:#64748b;stroke-width:2;rx:18}.box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12}.member{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}.done{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:12}.missing{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:12}.receipt{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;rx:12}.verdict{fill:#fef2f2;stroke:#b91c1c;stroke-width:2;rx:12}.title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#475569;letter-spacing:1.2px}.head{font:700 18px Arial,sans-serif;fill:#0f172a}.body{font:15px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#475569}.mono{font:13px 'Courier New',monospace;fill:#334155}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="780"/>
  <text x="55" y="52" class="title">Baton recorded run: two-member specification wave</text>
  <text x="55" y="80" class="subtitle">Public evidence from August 6, 2026 shows member completion, result harvesting, and an honest incomplete workflow verdict.</text>

  <rect class="group" x="55" y="110" width="1290" height="105"/>
  <text x="80" y="140" class="label">WAVE START</text>
  <text x="90" y="176" class="body">Two exact routes: DeepSeek harness · deepseek-v4-flash · high effort · independent scoped documentation worktrees</text>
  <text x="90" y="199" class="mono">runs: run-cca6d785e0e3349c15b74dd9d2ecc9e4 · run-1befc4d68d0187699845d0ef1b5bb80d</text>

  <path class="arrow" d="M700 215 L700 255"/>
  <rect class="group" x="55" y="255" width="1290" height="215"/>
  <text x="80" y="285" class="label">PARALLEL MEMBERS</text>
  <rect class="member" x="95" y="320" width="535" height="115"/>
  <text x="120" y="350" class="head">Member: harvest-contract</text>
  <text x="120" y="377" class="body">Draft the result-materialization and harvest-accessor contract</text>
  <text x="120" y="402" class="small">scope: docs/reference/evidence/harvest-accessor-2026-08-06/**</text>
  <rect class="member" x="770" y="320" width="535" height="115"/>
  <text x="795" y="350" class="head">Member: tight-cell-contract</text>
  <text x="795" y="377" class="body">Draft the tightly-coupled member-group contract</text>
  <text x="795" y="402" class="small">scope: docs/reference/evidence/tight-cell-2026-08-06/**</text>
  <rect class="done" x="215" y="430" width="295" height="30"/><text x="270" y="451" class="body">terminal phase: work_completed</text>
  <rect class="done" x="890" y="430" width="295" height="30"/><text x="945" y="451" class="body">terminal phase: work_completed</text>

  <path class="arrow" d="M700 470 L700 510"/>
  <rect class="group" x="55" y="510" width="1290" height="150"/>
  <text x="80" y="540" class="label">HARVEST RECEIPT</text>
  <rect class="missing" x="95" y="570" width="535" height="62"/>
  <text x="120" y="598" class="head">harvest-contract result missing</text><text x="120" y="620" class="small">worker completion did not produce the required harvested file</text>
  <rect class="receipt" x="770" y="570" width="535" height="62"/>
  <text x="795" y="598" class="head">tight-cell-contract harvested</text><text x="795" y="620" class="mono">pin 99cbb7c664fcdd5b41b1ecacb566c70dc734399b · 35,534 bytes</text>

  <path class="arrow" d="M700 660 L700 695"/>
  <rect class="verdict" x="330" y="695" width="740" height="52"/>
  <text x="475" y="728" class="head">Workflow verdict: SPEC-WAVE-INCOMPLETE</text>
  <text x="250" y="772" class="body">Both sessions finished and the pending roster drained; Baton still refused to report a complete workflow because one required result was not harvested.</text>
</svg>
