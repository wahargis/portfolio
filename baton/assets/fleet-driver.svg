<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840" role="img" aria-labelledby="title desc">
  <title id="title">Baton controlled software-delivery architecture</title>
  <desc id="desc">An operator approves a goal and plan. Baton validates and routes the work, supervises persistent coding-agent sessions in isolated Git worktrees, verifies captured artifacts, and controls result adoption and export.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/></marker>
    <style>
      .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}.group{fill:#f3f4f6;stroke:#646b75;stroke-width:1.5;rx:18}
      .title{font:700 27px Arial,sans-serif;fill:#17191d}.label{font:700 13px Arial,sans-serif;fill:#30343b;letter-spacing:1px}.head{font:700 18px Arial,sans-serif;fill:#20242a}.body{font:14px Arial,sans-serif;fill:#454b55}.small{font:13px Arial,sans-serif;fill:#555d68}.arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1320" height="840"/>
  <text x="55" y="52" class="title">Baton: controlled software delivery across persistent coding-agent harnesses</text>

  <rect class="box" x="105" y="88" width="1110" height="92"/>
  <text x="135" y="118" class="label">APPROVED INTENT</text>
  <text x="135" y="149" class="head">Objective · definition of done · constraints · risk · budget · scope · verification</text>

  <path class="arrow" d="M660 180 L660 225"/>
  <rect class="group" x="65" y="225" width="1190" height="205"/>
  <text x="90" y="255" class="label">BATON CONTROL PLANE</text>

  <rect class="box" x="95" y="285" width="250" height="110"/>
  <text x="120" y="317" class="head">Validate and route</text>
  <text x="120" y="346" class="body">versioned goal and plan</text>
  <text x="120" y="370" class="body">exact harness/model/effort</text>

  <rect class="box" x="385" y="285" width="250" height="110"/>
  <text x="410" y="317" class="head">Persistent sessions</text>
  <text x="410" y="346" class="body">provider capability adapters</text>
  <text x="410" y="370" class="body">events, prompts, stop controls</text>

  <rect class="box" x="675" y="285" width="250" height="110"/>
  <text x="700" y="317" class="head">Supervise interaction</text>
  <text x="700" y="346" class="body">questions · approvals · waits</text>
  <text x="700" y="370" class="body">checkpoints · steering · recovery</text>

  <rect class="box" x="965" y="285" width="250" height="110"/>
  <text x="990" y="317" class="head">Evidence and lineage</text>
  <text x="990" y="346" class="body">timeline · usage · artifacts</text>
  <text x="990" y="370" class="body">terminal and failure state</text>

  <path class="arrow" d="M660 430 L660 475"/>
  <rect class="group" x="65" y="475" width="1190" height="170"/>
  <text x="90" y="505" class="label">ISOLATED REPOSITORY WORK</text>
  <rect class="box" x="110" y="535" width="310" height="78"/>
  <text x="140" y="566" class="head">Worker worktree A</text>
  <text x="140" y="590" class="body">pinned base · scoped mutation</text>
  <rect class="box" x="505" y="535" width="310" height="78"/>
  <text x="535" y="566" class="head">Worker worktree B</text>
  <text x="535" y="590" class="body">independent persistent session</text>
  <rect class="box" x="900" y="535" width="310" height="78"/>
  <text x="930" y="566" class="head">Fresh verification sandbox</text>
  <text x="930" y="590" class="body">captured artifact · exact contract</text>

  <path class="arrow" d="M660 645 L660 690"/>
  <rect class="box" x="190" y="690" width="940" height="100"/>
  <text x="220" y="721" class="label">CONTROLLER-OWNED RESULT</text>
  <text x="220" y="751" class="head">verification evidence · adoption decision · integration or secure no-replace export</text>
  <text x="220" y="775" class="small">A worker can implement and report; it cannot grant itself repository or publication authority.</text>
</svg>
