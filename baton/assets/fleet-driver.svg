<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">Baton run application and persistent coding-agent fleet</title>
  <desc id="desc">A shared command bus controls a resident run application. The application validates goals and plans, schedules waves and workflows, selects exact routes, supervises persistent coding-harness sessions, stores interactions and context, owns Git worktrees, and preserves candidate results for review, adoption, and integration.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#475569"/></marker>
    <style>
      .h1{font:700 32px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Inter,Arial,sans-serif;fill:#475569}
      .band{font:700 15px Inter,Arial,sans-serif;fill:#15803d;letter-spacing:.8px}.nt{font:700 17px Inter,Arial,sans-serif;fill:#0f172a}.nc{font:400 14px Inter,Arial,sans-serif;fill:#334155}.small{font:400 13px Inter,Arial,sans-serif;fill:#475569}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.both{stroke:#475569;stroke-width:2.2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.line{stroke:#64748b;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1500" height="1120" fill="#f8fafc"/>
  <text x="70" y="62" class="h1">Baton: persistent coding-agent fleet control</text>
  <text x="70" y="92" class="sub">One run model coordinates planning, routes, sessions, interactions, context, repository ownership, and results.</text>

  <rect x="55" y="125" width="1390" height="215" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="158" class="band">RUN APPLICATION AND COMMAND SURFACES</text>
  <g transform="translate(85 195)"><rect width="230" height="100" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="18" y="32" class="nt">Human or orchestrator</text><text x="18" y="59" class="nc">Outcome, approval, answer,</text><text x="18" y="80" class="nc">steering, review, selection</text></g>
  <path class="arrow" d="M315 245 H375"/>
  <g transform="translate(380 185)"><rect width="250" height="120" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="nt">Shared command bus</text><text x="18" y="59" class="nc">CLI, MCP, and web use</text><text x="18" y="80" class="nc">the same run operations</text><text x="18" y="101" class="nc">and current interaction state</text></g>
  <path class="arrow" d="M630 245 H690"/>
  <g transform="translate(695 170)"><rect width="440" height="150" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/><text x="20" y="34" class="nt">Resident run application</text><text x="20" y="63" class="nc">Goal and plan, approval, status and wait, answers, steering, stop</text><text x="20" y="87" class="nc">Task topology, evidence, recovery, review, candidate selection</text><text x="20" y="111" class="nc">Adoption, local integration, result export, and run settlement</text><text x="20" y="136" class="small">Owns active fleet authority; clients do not become independent controllers</text></g>
  <path class="arrow" d="M1135 245 H1195"/>
  <g transform="translate(1200 185)"><rect width="190" height="120" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="18" y="32" class="nt">Run view</text><text x="18" y="59" class="nc">Members, interactions,</text><text x="18" y="80" class="nc">resources, evidence,</text><text x="18" y="101" class="nc">results and limits</text></g>

  <rect x="55" y="370" width="880" height="380" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="403" class="band">SCHEDULING, ROUTING, AND NATIVE SESSIONS</text>
  <g transform="translate(90 445)"><rect width="250" height="120" rx="12" fill="#ecfccb" stroke="#a3e635"/><text x="18" y="32" class="nt">Approved goal and plan</text><text x="18" y="59" class="nc">Scope, dependencies, effects,</text><text x="18" y="80" class="nc">budgets, route policy,</text><text x="18" y="101" class="nc">and completion contract</text></g>
  <path class="arrow" d="M340 505 H390"/>
  <g transform="translate(395 430)"><rect width="250" height="150" rx="12" fill="#ecfccb" stroke="#a3e635"/><text x="18" y="32" class="nt">Run scheduler</text><text x="18" y="59" class="nc">Dependency-ready nodes</text><text x="18" y="80" class="nc">Waves and workflows</text><text x="18" y="101" class="nc">Provider and workspace capacity</text><text x="18" y="122" class="nc">Interaction and limit state</text></g>
  <path class="arrow" d="M645 505 H695"/>
  <g transform="translate(700 430)"><rect width="190" height="150" rx="12" fill="#ecfccb" stroke="#a3e635"/><text x="18" y="32" class="nt">Exact route</text><text x="18" y="59" class="nc">Harness</text><text x="18" y="80" class="nc">Model</text><text x="18" y="101" class="nc">Effort</text><text x="18" y="122" class="nc">Capability and liveness</text></g>

  <g transform="translate(90 625)"><rect width="230" height="85" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text x="18" y="31" class="nt">Persistent Codex</text><text x="18" y="58" class="nc">Native session and events</text></g>
  <g transform="translate(350 625)"><rect width="230" height="85" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text x="18" y="31" class="nt">Persistent Claude</text><text x="18" y="58" class="nc">Native session and events</text></g>
  <g transform="translate(610 615)"><rect width="280" height="105" rx="12" fill="#f0fdf4" stroke="#4ade80"/><text x="18" y="31" class="nt">Other persistent harnesses</text><text x="18" y="58" class="nc">GLM, Grok, Kimi, and routes</text><text x="18" y="80" class="nc">with their own control semantics</text></g>
  <path class="arrow" d="M795 580 V615"/>
  <path class="arrow" d="M740 580 C700 605 520 600 465 625"/>
  <path class="arrow" d="M720 580 C620 600 285 595 205 625"/>

  <rect x="965" y="370" width="480" height="380" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="990" y="403" class="band">COORDINATION STATE</text>
  <g transform="translate(1000 440)"><rect width="410" height="145" rx="14" fill="#eef2ff" stroke="#a5b4fc"/><text x="20" y="34" class="nt">Durable coordination store and event log</text><text x="20" y="63" class="nc">Runs, plans, routes, sessions, events, limits, and resources</text><text x="20" y="87" class="nc">Questions, approvals, decisions, waits, checkpoints, and answers</text><text x="20" y="111" class="nc">Shared messages, scratch, knowledge, context maps, and results</text><text x="20" y="135" class="small">Run projections and recovery are rebuilt from recorded state</text></g>
  <g transform="translate(1000 625)"><rect width="195" height="85" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="31" class="nt">Operator attention</text><text x="18" y="58" class="nc">Current blocking state</text></g>
  <g transform="translate(1215 615)"><rect width="195" height="105" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="18" y="31" class="nt">Worker context</text><text x="18" y="58" class="nc">Brief, predecessors,</text><text x="18" y="80" class="nc">shared findings, messages</text></g>
  <path class="both" d="M935 530 H1000"/>
  <path class="arrow" d="M1205 585 V615"/>
  <path class="arrow" d="M1098 585 V625"/>
  <path class="both" d="M1135 270 V370"/>

  <rect x="55" y="780" width="1390" height="280" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="813" class="band">REPOSITORY WORK AND RESULT LIFECYCLE</text>
  <g transform="translate(90 860)"><rect width="250" height="125" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="nt">Owned Git worktrees</text><text x="18" y="59" class="nc">Known base, path scope,</text><text x="18" y="80" class="nc">workspace and process ownership,</text><text x="18" y="101" class="nc">capacity and cleanup state</text></g>
  <path class="arrow" d="M340 922 H400"/>
  <g transform="translate(405 860)"><rect width="250" height="125" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="18" y="32" class="nt">Captured candidates</text><text x="18" y="59" class="nc">Exact repository state,</text><text x="18" y="80" class="nc">run and session lineage,</text><text x="18" y="101" class="nc">effects and worker result</text></g>
  <path class="arrow" d="M655 922 H715"/>
  <g transform="translate(720 850)"><rect width="260" height="145" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="18" y="32" class="nt">Evaluation</text><text x="18" y="59" class="nc">Verification at captured state</text><text x="18" y="80" class="nc">Independent review when requested</text><text x="18" y="101" class="nc">Evidence attached to candidate</text><text x="18" y="122" class="nc">Conflicts and failures remain explicit</text></g>
  <path class="arrow" d="M980 922 H1040"/>
  <g transform="translate(1045 850)"><rect width="320" height="145" rx="12" fill="#dcfce7" stroke="#4ade80"/><text x="18" y="32" class="nt">Result operations</text><text x="18" y="59" class="nc">Preserve and compare candidates</text><text x="18" y="80" class="nc">Adopt a selected result</text><text x="18" y="101" class="nc">Apply an allowed local integration</text><text x="18" y="122" class="nc">Export and release resources deliberately</text></g>
  <path class="line" d="M205 750 V860"/><path class="line" d="M465 750 V860"/><path class="line" d="M750 750 V850"/>
  <path class="arrow" d="M1205 995 V1030 H1205"/>
  <path class="arrow" d="M1205 850 V750"/>
  <text x="1010" y="1040" class="small">result and cleanup state returns to the durable run record</text>
</svg>
