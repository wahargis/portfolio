<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Baton cross-harness fleet-driver architecture</title>
  <desc id="desc">A human or orchestrator harness uses one application to delegate, observe, communicate, steer, coordinate, recover, and harvest work from heterogeneous full-session coding harnesses. A deterministic coordinator carries out those decisions reliably.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
    </marker>
    <style>
      .bg{fill:#fbfbfc}.box{fill:#fff;stroke:#30343b;stroke-width:2;rx:14}
      .group{fill:#f2f4f7;stroke:#59616d;stroke-width:1.7;rx:18}
      .kernel{fill:#fff;stroke:#646b75;stroke-width:2;stroke-dasharray:8 6;rx:14}
      .title{font:700 26px Arial,sans-serif;fill:#17191d}.head{font:700 17px Arial,sans-serif;fill:#20242a}
      .body{font:14px Arial,sans-serif;fill:#454b55}.label{font:700 13px Arial,sans-serif;fill:#30343b;letter-spacing:1px}
      .small{font:12px Arial,sans-serif;fill:#555d68}.arrow{stroke:#30343b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .two{stroke:#30343b;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .dash{stroke:#646b75;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text x="55" y="50" class="title">Baton: one harness drives a fleet of full harness sessions</text>

  <rect class="box" x="55" y="90" width="310" height="125"/>
  <text x="80" y="122" class="label">DRIVER SEAT</text>
  <text x="80" y="154" class="head">Human + orchestrator harness</text>
  <text x="80" y="180" class="body">plans · delegates · answers · intervenes</text>

  <rect class="box" x="450" y="90" width="775" height="125"/>
  <text x="475" y="122" class="label">ONE APPLICATION AUTHORITY</text>
  <text x="475" y="154" class="head">MCP · CLI · resident bus · embedded API</text>
  <text x="475" y="180" class="body">different entry points, one run/wave/workflow model and one fleet truth</text>

  <path class="arrow" d="M365 152 L450 152"/>

  <rect class="group" x="55" y="270" width="1170" height="245"/>
  <text x="80" y="302" class="label">FLEET APPLICATION</text>

  <rect class="box" x="85" y="330" width="245" height="135"/>
  <text x="108" y="362" class="head">Delegate</text>
  <text x="108" y="388" class="body">plans · exact routes</text>
  <text x="108" y="410" class="body">briefs · scopes · worktrees</text>

  <rect class="box" x="365" y="330" width="245" height="135"/>
  <text x="388" y="362" class="head">Observe + communicate</text>
  <text x="388" y="388" class="body">telemetry · attention</text>
  <text x="388" y="410" class="body">questions · answers · replies</text>

  <rect class="box" x="645" y="330" width="245" height="135"/>
  <text x="668" y="362" class="head">Steer + recover</text>
  <text x="668" y="388" class="body">interrupt · redirect · checkpoint</text>
  <text x="668" y="410" class="body">reattach · redrive · stop</text>

  <rect class="box" x="925" y="330" width="270" height="135"/>
  <text x="948" y="362" class="head">Coordinate + harvest</text>
  <text x="948" y="388" class="body">waves · workflows · shared state</text>
  <text x="948" y="410" class="body">artifacts · review · integration</text>

  <path class="arrow" d="M837 215 L837 270"/>

  <rect class="kernel" x="240" y="565" width="800" height="105"/>
  <text x="265" y="596" class="label">RELIABILITY KERNEL UNDER THE DRIVER</text>
  <text x="265" y="626" class="body">durable events · command ordering · incarnation fences · process ownership · capacity · replay · cleanup</text>
  <text x="265" y="649" class="small">Carries out the orchestrator’s decisions; it is not a replacement for the fleet-driving product.</text>

  <path class="arrow" d="M640 515 L640 565"/>

  <rect class="group" x="55" y="725" width="1170" height="70"/>
  <text x="80" y="755" class="label">HETEROGENEOUS FULL-SESSION WORKERS</text>
  <text x="80" y="780" class="body">Claude Code · Codex · GLM-backed and other harnesses — native tools, context, approvals, sessions, sandboxes, and isolated git work</text>

  <path class="arrow" d="M640 670 L640 725"/>

  <path class="dash" d="M365 735 C260 690 190 645 190 515"/>
  <text x="90" y="628" class="small">questions / results / telemetry</text>
  <path class="dash" d="M1090 515 C1090 620 1030 680 915 725"/>
  <text x="1032" y="628" class="small">steering / shared context</text>
</svg>
